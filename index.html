<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subestação Elétrica 3D - Gem3D Industrial</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 4px;
    }
    .pulse-glow {
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.5);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ÍCONES SVG customizados para performance e independência ---
    const Icons = {
      Zap: () => (
        <svg className="w-5 h-5 text-amber-400 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      ),
      Shield: () => (
        <svg className="w-5 h-5 text-emerald-400 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      ),
      Camera: () => (
        <svg className="w-5 h-5 text-sky-400 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
      ),
      Activity: () => (
        <svg className="w-5 h-5 text-rose-400 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      ),
      Eye: () => (
        <svg className="w-5 h-5 text-indigo-400 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      ),
      AlertTriangle: () => (
        <svg className="w-5 h-5 text-red-500 inline animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      )
    };

    // --- Tour guiado: como a Treetech, os módulos, o E3, o Sync e o Sigma ECM se encaixam ---
    const TOUR_STEPS = [
      {
        title: 'A Treetech',
        text: 'A Treetech fabrica módulos, que são as peças instaladas na subestação e nos transformadores, e também criou o software que monitora esses módulos: o Sigma ECM.',
        camera: { position: [100, 55, 75], target: [38, 0, 14] },
        mode: 'sync',
        roofs: { plant: false, treetech: false, factory: false },
        labels: ['factory', 'treetech', 'substation']
      },
      {
        title: 'A fábrica de módulos',
        text: 'No galpão da Treetech os módulos são montados em uma linha de produção. Os funcionários montam as peças na esteira e as caixas saem para entrega.',
        camera: { position: [68, 16, 47], target: [54, 1, 33] },
        mode: 'sync',
        roofs: { plant: false, treetech: false, factory: true },
        labels: ['factory']
      },
      {
        title: 'Da fábrica à subestação',
        text: 'Vans levam os módulos da fábrica até a subestação e voltam vazias. É o caminho de ida e volta pela estrada, entre a Treetech e a subestação.',
        camera: { position: [26, 42, 62], target: [26, 0, 19.5] },
        mode: 'sync',
        roofs: { plant: false, treetech: false, factory: false },
        labels: ['vans', 'factory', 'substation']
      },
      {
        title: 'Os módulos instalados',
        text: 'Na subestação, os módulos ficam presos aos equipamentos. TM mede a temperatura do transformador, BM monitora as buchas, GMP mede gás e umidade do óleo e DM captura o estado dos contatos dos disjuntores.',
        camera: { position: [11, 8, 11], target: [1, 1.8, 0.2] },
        mode: 'sync',
        roofs: { plant: false, treetech: false, factory: false },
        labels: ['tm', 'bm', 'gmp', 'dm1', 'dm2']
      },
      {
        title: 'Forma 1: E3 (TCP/IP)',
        text: 'No E3, o Sigma pergunta ao módulo, por TCP/IP, se há informação nova. Os pacotes azuis são as perguntas, saindo do servidor da Treetech até o módulo, e os verdes são as respostas dos módulos.',
        camera: { position: [78, 42, 58], target: [30, 4, 8] },
        mode: 'e3',
        roofs: { plant: false, treetech: false, factory: false },
        labels: ['mast', 'treetech', 'substation']
      },
      {
        title: 'Forma 2: Sync (RabbitMQ)',
        text: 'No Sync, o módulo envia a atualização por conta própria. Os pacotes laranja entram na fila do RabbitMQ (o tubo de vidro) e o Sigma os retira de lá.',
        camera: { position: [58, 11, -13], target: [58.5, 1.5, 4] },
        mode: 'sync',
        roofs: { plant: false, treetech: false, factory: false },
        labels: ['rabbit', 'treetech']
      },
      {
        title: 'O banco de dados',
        text: 'Nas duas formas, a informação recebida é salva no banco de dados, que pode ser PostgreSQL ou SQL Server. A cena mostra os dois, e o que está em uso fica destacado em verde.',
        camera: { position: [70, 5, 10], target: [60.9, 0.9, 3.5] },
        mode: 'sync',
        roofs: { plant: false, treetech: false, factory: false },
        labels: ['db1', 'db2']
      },
      {
        title: 'Sigma ECM',
        text: 'Por fim, as informações aparecem no Sigma ECM, em telas como este painel da Treetech. Os usuários também acessam o Sigma pelos PCs dos escritórios, como o da usina.',
        camera: { position: [46, 7, 17], target: [46, 2.1, 5.7] },
        mode: 'sync',
        roofs: { plant: false, treetech: true, factory: false },
        labels: ['sigma', 'plant']
      }
    ];

    // --- Componente Principal da Subestação ---
    function SubstationApp() {
      const [selectedComponent, setSelectedComponent] = useState(null);
      const [viewMode, setViewMode] = useState('normal'); // 'normal', 'xray', 'thermal', 'night'
      const [breakerClosed, setBreakerClosed] = useState(true);
      const [loadLevel] = useState(78); // %
      const [alarms, setAlarms] = useState([]);
      const [tourStep, setTourStep] = useState(null);

      const sceneRef = useRef(null);
      const controlsRef = useRef(null);
      const componentMeshesRef = useRef({});
      const particleSystemsRef = useRef([]);
      const breakerClosedRef = useRef(true);
      breakerClosedRef.current = breakerClosed;
      const loadLevelRef = useRef(78);
      loadLevelRef.current = loadLevel;
      const plantRoofApiRef = useRef({ setOpen: () => {} });
      const treetechRoofApiRef = useRef({ setOpen: () => {} });
      const sceneApiRef = useRef({ setMode: () => {}, setRoofs: () => {}, setLabels: () => {} });

      // Dados dos Componentes para inspeção técnica
      const componentData = {
        transformer: {
          title: "Transformador Principal de Potência (Trafo 01)",
          voltage: "138 kV / 13.8 kV",
          power: "50 MVA",
          temp: `${Math.round(55 + (loadLevel * 0.25))} °C`,
          status: breakerClosed ? "OPERACIONAL (EM CARGA)" : "DESENERGIZADO",
          desc: "Unidade central rebaixadora de tensão de óleo mineral com conservador externo e conjunto de radiadores de refrigeração forçada."
        },
        gantry: {
          title: "Pórtico Metálico e Barramento de Alta Tensão",
          voltage: "138 kV AC",
          power: `${Math.round(48 * (loadLevel/100))} MW`,
          temp: "32 °C",
          status: "ENERGIZADO (GRID)",
          desc: "Estrutura treliçada em aço galvanizado para ancoragem de cabos condutores de chegada e isoladores de disco tipo suspensão."
        },
        breaker_1: {
          title: "Disjuntor Principal a Gás SF6 - Baía AT",
          voltage: "138 kV",
          pressure: "6.2 bar (Gás SF6)",
          status: breakerClosed ? "FECHADO (CONDUZINDO)" : "ABERTO (ISOLADO)",
          temp: "38 °C",
          desc: "Disjuntor de alta velocidade com câmara de extinção de arco por sopro de SF6 para proteção contra curto-circuitos."
        },
        breaker_2: {
          title: "Conjunto de Disjuntores MT - Alimentadores",
          voltage: "13.8 kV",
          status: breakerClosed ? "FECHADO" : "ABERTO",
          temp: "35 °C",
          desc: "Módulos de interrupção em média tensão protegendo a saída dos circuitos de distribuição regional."
        },
        radiators: {
          title: "Bateria de Radiadores e Refrigeração (ONAF)",
          flow: `${Math.round(850 * (loadLevel/100))} L/min`,
          fans: loadLevel > 60 ? "4 Ventoínhas ATIVAS" : "2 Ventoínhas ATIVAS",
          temp: `${Math.round(42 + (loadLevel * 0.15))} °C`,
          status: "EM OPERAÇÃO",
          desc: "Trocadores de calor a óleo-ar para dissipação de perdas térmicas do núcleo do transformador."
        },
        cabinets: {
          title: "Armários de Comando, Proteção e SCADA",
          protocol: "IEC 61850 / DNP3",
          plcStatus: "CPU OK - S7-1500",
          temp: "26 °C",
          status: "SISTEMA ONLINE",
          desc: "Painéis metálicos IP65 contendo relés numéricos de proteção, controladores lógicos e RTU de automação."
        },
        arresters: {
          title: "Conjunto de Para-Raios de Óxido Metálico (ZnO)",
          mcov: "84 kV RMS",
          dischargeCount: "03 Eventos",
          status: "PROTEÇÃO ATIVA",
          temp: "28 °C",
          desc: "Dispositivos de proteção contra sobretensões atmosféricas e de manobra conectados ao barramento."
        }
      };

      // Inicialização da Cena Three.js
      useEffect(() => {
        const container = document.getElementById('canvas-container');
        if (!container) return;

        // Cena, Câmera e Renderizador
        const scene = new THREE.Scene();
        sceneRef.current = scene;
        scene.background = new THREE.Color(viewMode === 'night' ? '#070b12' : '#dbeafe');

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Vista Isométrica inicial idêntica à foto
        camera.position.set(109, 75, 84);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        container.appendChild(renderer.domElement);

        // Controles de Câmera Órbita
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; // Não atravessar o chão
        controls.minDistance = 5;
        controls.maxDistance = 220;
        controls.target.set(29, 0, 4);
        controlsRef.current = controls;

        // Iluminação Ambientes e Sol
        const ambientLight = new THREE.AmbientLight(0xffffff, viewMode === 'night' ? 0.2 : 0.65);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, viewMode === 'night' ? 0.1 : 1.2);
        sunLight.position.set(25, 35, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 220;
        const d = 80;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // Luzes Noturnas de Segurança (Spotlights nos cantos da cerca)
        const nightSpotlights = [];
        const spotPos = [[-7.5, 7.5], [7.5, 7.5], [-7.5, -7.5], [7.5, -7.5]];
        spotPos.forEach(([x, z]) => {
          const spot = new THREE.SpotLight(0xfffaed, viewMode === 'night' ? 2.5 : 0, 25, Math.PI / 4, 0.4);
          spot.position.set(x, 4.5, z);
          spot.target.position.set(0, 1, 0);
          scene.add(spot);
          scene.add(spot.target);
          nightSpotlights.push(spot);
        });

        // --- MATERIAIS ---
        const colors = {
          grass: '#82ad50',
          concrete: '#b0b5ba',
          transformerGrey: '#7b8793',
          radiatorGrey: '#5a646e',
          porcelainBrown: '#5c2d18',
          metalSteel: '#8a97a4',
          yellowFence: '#f3b312',
          cabinetWhite: '#e2e8f0',
          warningYellow: '#eab308'
        };

        const matGrass = new THREE.MeshStandardMaterial({ color: colors.grass, roughness: 0.9 });
        const matConcrete = new THREE.MeshStandardMaterial({ color: colors.concrete, roughness: 0.6 });
        const matTrafo = new THREE.MeshStandardMaterial({ color: colors.transformerGrey, roughness: 0.4, metalness: 0.3 });
        const matRadiator = new THREE.MeshStandardMaterial({ color: colors.radiatorGrey, roughness: 0.5, metalness: 0.2 });
        const matPorcelain = new THREE.MeshStandardMaterial({ color: colors.porcelainBrown, roughness: 0.15, metalness: 0.1 });
        const matSteel = new THREE.MeshStandardMaterial({ color: colors.metalSteel, roughness: 0.3, metalness: 0.7 });
        const matFence = new THREE.MeshStandardMaterial({ color: colors.yellowFence, roughness: 0.4, metalness: 0.2 });
        const matCabinet = new THREE.MeshStandardMaterial({ color: colors.cabinetWhite, roughness: 0.3, metalness: 0.1 });

        // Grupo principal da Subestação
        const substationGroup = new THREE.Group();
        scene.add(substationGroup);

        // 1. TERRENO E BASE
        // Gramado Externo (Diamante em Isométrico)
        const grassGeo = new THREE.BoxGeometry(26, 0.4, 26);
        const grassMesh = new THREE.Mesh(grassGeo, matGrass);
        grassMesh.position.y = -0.2;
        grassMesh.receiveShadow = true;
        substationGroup.add(grassMesh);

        // Placa de Concreto da Subestação
        const padGeo = new THREE.BoxGeometry(16, 0.3, 16);
        const padMesh = new THREE.Mesh(padGeo, matConcrete);
        padMesh.position.y = 0.15;
        padMesh.receiveShadow = true;
        padMesh.castShadow = true;
        substationGroup.add(padMesh);

        // Brita/Gravel Layer
        const gravelGeo = new THREE.BoxGeometry(15.2, 0.05, 15.2);
        const matGravel = new THREE.MeshStandardMaterial({ color: '#8d9296', roughness: 0.95 });
        const gravelMesh = new THREE.Mesh(gravelGeo, matGravel);
        gravelMesh.position.y = 0.32;
        gravelMesh.receiveShadow = true;
        substationGroup.add(gravelMesh);

        // 2. CERCA DE SEGURANÇA AMARELA
        const createFence = () => {
          const fenceGroup = new THREE.Group();
          const pMin = -7.3;
          const pMax = 7.3;
          const height = 1.8;
          // Portão no lado leste (para a usina): vão entre gateZ - gateHalf e gateZ + gateHalf
          const gateZ = 0.35;
          const gateHalf = 1.4;
          // Portão no lado sul, na ponta da estrada das vans
          const southGateX = -4;

          // Postes de Canto e Intermediários
          const postGeo = new THREE.CylinderGeometry(0.06, 0.06, height);
          const fencePositions = [];

          for (let i = pMin; i <= pMax; i += 1.83) {
            fencePositions.push([i, pMin], [pMin, i]);
            if (Math.abs(i - southGateX) > gateHalf) fencePositions.push([i, pMax]);
            if (Math.abs(i - gateZ) > gateHalf) fencePositions.push([pMax, i]);
          }
          fencePositions.push([pMax, gateZ - gateHalf], [pMax, gateZ + gateHalf]);
          fencePositions.push([southGateX - gateHalf, pMax], [southGateX + gateHalf, pMax]);

          fencePositions.forEach(([x, z]) => {
            const post = new THREE.Mesh(postGeo, matFence);
            post.position.set(x, 0.3 + height / 2, z);
            post.castShadow = true;
            fenceGroup.add(post);
          });

          // Trilhos Horizontais de Cerca
          const createRail = (x1, z1, x2, z2, h) => {
            const dx = x2 - x1;
            const dz = z2 - z1;
            const len = Math.sqrt(dx * dx + dz * dz);
            const railGeo = new THREE.BoxGeometry(0.04, 0.04, len);
            const rail = new THREE.Mesh(railGeo, matFence);
            rail.position.set((x1 + x2) / 2, h, (z1 + z2) / 2);
            rail.rotation.y = Math.atan2(dx, dz);
            fenceGroup.add(rail);
          };

          const heights = [0.5, 1.2, 1.9];
          heights.forEach(h => {
            createRail(pMin, pMin, pMax, pMin, h);
            createRail(pMin, pMax, southGateX - gateHalf, pMax, h);
            createRail(southGateX + gateHalf, pMax, pMax, pMax, h);
            createRail(pMin, pMin, pMin, pMax, h);
            createRail(pMax, pMin, pMax, gateZ - gateHalf, h);
            createRail(pMax, gateZ + gateHalf, pMax, pMax, h);
          });

          // Placa de Sinalização "PERIGO ALTA TENSÃO ⚡"
          const signGeo = new THREE.PlaneGeometry(0.6, 0.4);
          const matSign = new THREE.MeshBasicMaterial({ color: '#fef08a', side: THREE.DoubleSide });
          const sign = new THREE.Mesh(signGeo, matSign);
          sign.position.set(0, 1.2, pMax + 0.02);
          fenceGroup.add(sign);

          return fenceGroup;
        };
        substationGroup.add(createFence());

        // Helper para criar Isoladores cerâmicos marrons sanfonados
        const createBushing = (height = 1.2, radius = 0.18) => {
          const group = new THREE.Group();
          const coreGeo = new THREE.CylinderGeometry(radius * 0.6, radius * 0.6, height, 16);
          const core = new THREE.Mesh(coreGeo, matPorcelain);
          core.castShadow = true;
          group.add(core);

          // Anéis/Discos de Saia Cerâmica
          const ringCount = Math.floor(height * 6);
          const ringGeo = new THREE.TorusGeometry(radius, radius * 0.22, 8, 16);
          ringGeo.rotateX(Math.PI / 2);

          for (let i = 0; i < ringCount; i++) {
            const ring = new THREE.Mesh(ringGeo, matPorcelain);
            ring.position.y = -height / 2 + (i + 0.5) * (height / ringCount);
            ring.castShadow = true;
            group.add(ring);
          }

          // Terminal metálico superior
          const capGeo = new THREE.CylinderGeometry(radius * 0.5, radius * 0.5, 0.15, 12);
          const cap = new THREE.Mesh(capGeo, matSteel);
          cap.position.y = height / 2 + 0.075;
          group.add(cap);

          return group;
        };

        // 3. TRANSFORMADOR PRINCIPAL (CENTRAL)
        const createMainTransformer = () => {
          const trafoGroup = new THREE.Group();
          trafoGroup.name = "transformer";

          // Corpo Principal Tanque do Trafo
          const bodyGeo = new THREE.BoxGeometry(3.2, 2.2, 2.4);
          const body = new THREE.Mesh(bodyGeo, matTrafo);
          body.position.set(0, 1.4, 0);
          body.castShadow = true;
          body.receiveShadow = true;
          trafoGroup.add(body);

          // Tanque Conservador Superior (Cilindro)
          const consGeo = new THREE.CylinderGeometry(0.5, 0.5, 2.8, 16);
          consGeo.rotateZ(Math.PI / 2);
          const conservator = new THREE.Mesh(consGeo, matTrafo);
          conservator.position.set(-0.2, 3.2, -0.6);
          conservator.castShadow = true;
          trafoGroup.add(conservator);

          // Suportes do Conservador
          const suppGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
          const s1 = new THREE.Mesh(suppGeo, matSteel);
          s1.position.set(-1.0, 2.7, -0.6);
          const s2 = new THREE.Mesh(suppGeo, matSteel);
          s2.position.set(0.6, 2.7, -0.6);
          trafoGroup.add(s1);
          trafoGroup.add(s2);

          // Buchas de Alta Tensão (AT) - 3 Fases
          const bushingsAT = [];
          for (let i = -1; i <= 1; i++) {
            const b = createBushing(1.4, 0.22);
            b.position.set(i * 0.8, 2.5 + 0.7, 0.4);
            trafoGroup.add(b);
            bushingsAT.push(b);
          }

          // Buchas de Média Tensão (MT) - 4 Fases (com neutro)
          for (let i = -1.2; i <= 1.2; i += 0.8) {
            const b = createBushing(0.9, 0.15);
            b.position.set(i, 2.5 + 0.45, -0.6);
            trafoGroup.add(b);
          }

          // Bateria de Radiadores de Refrigeração na Lateral Posterior
          const radGroup = new THREE.Group();
          radGroup.name = "radiators";
          for (let r = -1.2; r <= 1.2; r += 0.4) {
            const radFin = new THREE.BoxGeometry(0.12, 1.8, 1.6);
            const fin = new THREE.Mesh(radFin, matRadiator);
            fin.position.set(r, 1.4, -2.0);
            fin.castShadow = true;
            radGroup.add(fin);
          }
          // Tubos de conexão do radiador ao tanque
          const pipeGeo = new THREE.CylinderGeometry(0.1, 0.1, 2.6);
          pipeGeo.rotateZ(Math.PI / 2);

        // 4. PÓRTICO METÁLICO DE ENTRADA (GANTRY FRAME)
        const createGantry = () => {
          const gantryGroup = new THREE.Group();
          gantryGroup.name = "gantry";

          const towerHeight = 7.5;
          const towerSpacing = 6.0;

          // Colunas Treliçadas Metálicas
          const createTrussColumn = (x, z) => {
            const col = new THREE.Group();
            const mainLegGeo = new THREE.CylinderGeometry(0.06, 0.08, towerHeight);

            // 4 pernas de cada torre treliçada
            const offset = 0.25;
            [[-offset, -offset], [offset, -offset], [-offset, offset], [offset, offset]].forEach(([ox, oz]) => {
              const leg = new THREE.Mesh(mainLegGeo, matSteel);
              leg.position.set(x + ox, towerHeight / 2 + 0.3, z + oz);

            // Travessas em Z
            for (let h = 1.0; h < towerHeight; h += 0.8) {

          gantryGroup.add(createTrussColumn(-towerSpacing / 2, -4.5));

          beam.position.set(0, towerHeight, -4.5);

          // Isoladores do Barramento de Alta Tensão Suspensos

            stringBushing.position.set(i, towerHeight - 0.7, -4.5);
            gantryGroup.add(stringBushing);

          return gantryGroup;
        };

        const gantryMesh = createGantry();
        substationGroup.add(gantryMesh);
        componentMeshesRef.current['gantry'] = gantryMesh;

        // 5. DISJUNTORES A GÁS SF6 E SECCIONADORAS (BAÍAS LATERAIS)

        const breaker1 = createCircuitBreakerUnit(-4.2, -1.0, 'breaker_1');

        // 6. ARMÁRIOS DE COMANDO E CONTROLE SCADA
        const createControlCabinets = () => {
          const group = new THREE.Group();

          for (let c = 0; c < 2; c++) {

        // 7. ARRANJO DE PARA-RAIOS E MEDIÇÃO
        const createArresterRack = () => {
          const rackGroup = new THREE.Group();

          const frameGeo = new THREE.BoxGeometry(2.2, 0.8, 0.4);

        // 8. CABOS DE CONEXÃO E CONDUTORES ELÉTRICOS (CATENÁRIAS)
        const createPowerCables = () => {
          const cablesGroup = new THREE.Group();
          const cableMat = new THREE.LineBasicMaterial({ color: 0x222222, linewidth: 2 });

          const drawCurve = (p1, p2, sag = 0.4) => {
            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            mid.y -= sag; // Curvatura natural do cabo por gravidade

            const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
            const points = curve.getPoints(20);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, cableMat);
            cablesGroup.add(line);

            // Criar partículas elétricas para animação de fluxo de energia
            if (breakerClosed) {
              const particleGeo = new THREE.BufferGeometry();
              const pCount = 5;
              const pPos = new Float32Array(pCount * 3);

              const pMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.15, transparent: true, opacity: 0.9 });
              const particles = new THREE.Points(particleGeo, pMat);
              particles.userData = { curve, speed: 0.008 + Math.random() * 0.004, progress: Math.random() };
              scene.add(particles);
              particleSystemsRef.current.push(particles);
            }
          };

          // Cabos do Pórtico para o Disjuntor 1
          drawCurve(new THREE.Vector3(-2, 6.8, -4.5), new THREE.Vector3(-4.2, 2.5, -1.0));
          drawCurve(new THREE.Vector3(0, 6.8, -4.5), new THREE.Vector3(-3.7, 2.5, -1.0));
          drawCurve(new THREE.Vector3(2, 6.8, -4.5), new THREE.Vector3(-4.7, 2.5, -1.0));

          // Cabos do Disjuntor 1 para as Buchas AT do Trafo
          drawCurve(new THREE.Vector3(-4.2, 2.5, -1.0), new THREE.Vector3(-0.8, 3.8, 0.4));
          drawCurve(new THREE.Vector3(-3.7, 2.5, -1.0), new THREE.Vector3(0, 3.8, 0.4));
          drawCurve(new THREE.Vector3(-4.7, 2.5, -1.0), new THREE.Vector3(0.8, 3.8, 0.4));

          // Cabos do Trafo para o Disjuntor 2
          drawCurve(new THREE.Vector3(0, 3.2, -0.6), new THREE.Vector3(4.2, 2.5, 1.5));

          return cablesGroup;
        };

        const cablesMesh = createPowerCables();
        substationGroup.add(cablesMesh);

        // 9. PESSOAS ANDANDO PELOS CORREDORES DA SUBESTAÇÃO
        const createWorker = (vestColor) => {
          const worker = new THREE.Group();
          const matVest = new THREE.MeshStandardMaterial({ color: vestColor, roughness: 0.6 });
          const matSkin = new THREE.MeshStandardMaterial({ color: '#f1c7a1', roughness: 0.8 });

          const matHelmet = new THREE.MeshStandardMaterial({ color: '#ffd23f', roughness: 0.4 });

          // Cada membro gira em torno de um pivô (quadril ou ombro)
          const makeLimb = (geo, mat, x, y, drop) => {
            const pivot = new THREE.Group();
            pivot.position.set(x, y, 0);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = drop;
            mesh.castShadow = true;
            pivot.add(mesh);
            return pivot;
          };

          const legGeo = new THREE.BoxGeometry(0.16, 0.8, 0.16);
          const armGeo = new THREE.BoxGeometry(0.12, 0.6, 0.12);
          const leftLeg = makeLimb(legGeo, matPants, -0.11, 0.85, -0.4);
          const rightLeg = makeLimb(legGeo, matPants, 0.11, 0.85, -0.4);
          const leftArm = makeLimb(armGeo, matVest, -0.28, 1.4, -0.28);
          const rightArm = makeLimb(armGeo, matVest, 0.28, 1.4, -0.28);
          worker.add(leftLeg, rightLeg, leftArm, rightArm);

          const torso = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.6, 0.26), matVest);
          torso.position.y = 1.15;
          torso.castShadow = true;
          worker.add(torso);

          const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), matSkin);
          head.position.y = 1.62;
          head.castShadow = true;
          worker.add(head);

          const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), matHelmet);
          helmet.position.y = 1.66;
          helmet.castShadow = true;
          worker.add(helmet);

          worker.userData = { leftLeg, rightLeg, leftArm, rightArm, head };
          return worker;
        };

        // Trajetos em [x, z]: 'loop' fecha o circuito, 'pingpong' vai e volta
        const makePath = (points, mode) => {
          const pts = mode === 'loop' ? [...points, points[0]] : points;
          const segs = [];
          let total = 0;
          for (let i = 0; i < pts.length - 1; i++) {
            const a = pts[i];
            const b = pts[i + 1];
            const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
            segs.push({ a, b, len, start: total });
            total += len;
          }
          return { segs, total, mode };
        };

        const samplePath = (path, distance) => {
          const span = path.mode === 'loop' ? path.total : path.total * 2;
          let d = ((distance % span) + span) % span;
          let dir = 1;
          if (path.mode === 'pingpong' && d > path.total) {
            d = span - d;
            dir = -1;
          }
          const seg = path.segs.find(s => d <= s.start + s.len) || path.segs[path.segs.length - 1];
          const t = seg.len === 0 ? 0 : (d - seg.start) / seg.len;
          const dx = seg.b[0] - seg.a[0];
          const dz = seg.b[1] - seg.a[1];
          return { x: seg.a[0] + dx * t, z: seg.a[1] + dz * t, heading: Math.atan2(dx * dir, dz * dir) };
        };

        const walkerDefs = [
          {
            color: '#ff7a1a', mode: 'loop', speed: 1.3, offset: 0,
            points: [
              [-6.3, 6.3], [6.3, 6.3], [6.3, 0.35],
              [14.2, 0.35], [14.2, -6.5], [23.2, -6.5], [23.2, 6.8], [11, 6.8], [11, 0.35],
              [6.3, 0.35], [6.3, -6.3], [-6.3, -6.3]
            ]
          },
          {
            color: '#ffd23f', mode: 'loop', speed: 1.1, offset: 45,
            points: [
              [-6.3, -6.3], [6.3, -6.3], [6.3, 0.35],
              [11, 0.35], [11, 6.8], [23.2, 6.8], [23.2, -6.5], [14.2, -6.5], [14.2, 0.35],
              [6.3, 0.35], [6.3, 6.3], [-6.3, 6.3]
            ]
          }
        ];

        const walkers = walkerDefs.map(def => {
          const group = createWorker(def.color);
          substationGroup.add(group);
          return { group, path: makePath(def.points, def.mode), speed: def.speed, offset: def.offset };
        });

        // 10. CIDADE E TORRES DE TRANSMISSÃO AO LADO DA SUBESTAÇÃO
        const cityWorld = new THREE.Group();
        cityWorld.position.set(46, 0, -16.5);
        scene.add(cityWorld);

        const matLatticeSteel = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.85, roughness: 0.15 });
        const matSteelJoint = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.7, roughness: 0.3 });
        const matInsulator = new THREE.MeshStandardMaterial({ color: 0x9a6b52, roughness: 0.2, metalness: 0.1 });
        const matSubstationBase = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.6 });
        const matYellowStripe = new THREE.MeshStandardMaterial({ color: 0xcbb877, roughness: 0.3 });
        const matRoad = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.7 });
        const matRoadLine = new THREE.MeshStandardMaterial({ color: 0xcdbf8a, roughness: 0.3 });
        const matGrassPlot = new THREE.MeshStandardMaterial({ color: 0xa8bd98, roughness: 0.7 });
        const matConcreteCurb = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
        const matWhiteWall = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const matTrunkWood = new THREE.MeshStandardMaterial({ color: 0x7a6048, roughness: 0.8 });
        const matTreeFoliage = new THREE.MeshStandardMaterial({ color: 0x6f9a6a, roughness: 0.6 });

        const cityPulses = [];
        const cityWires = [];
        const cityWindows = [];

        // Grama de ligação entre a placa da subestação e a cidade
        const bridgeGround = new THREE.Mesh(new THREE.BoxGeometry(59.5, 0.4, 50), matGrass);
        bridgeGround.position.set(-3.75, -0.22, 4.5);
        bridgeGround.receiveShadow = true;
        cityWorld.add(bridgeGround);

        // Torre de transmissão em treliça com isoladores cerâmicos
        const createTransmissionPylon = (x, z) => {
          const pylon = new THREE.Group();
          pylon.position.set(x, 0, z);

          const padBase = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 0.2, 32), matYellowStripe);
          padBase.position.y = 0.1;
          padBase.receiveShadow = true;
          pylon.add(padBase);

          const pad = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 0.25, 32), matSubstationBase);
          pad.position.y = 0.25;
          pad.receiveShadow = true;
          pylon.add(pad);

          const towerHeight = 12.5;

          for (let i = 0; i < 4; i++) {
            const angle = (i * Math.PI) / 2 + Math.PI / 4;
            const botR = 1.45;
            const topR = 0.42;

            const x1 = Math.cos(angle) * botR;
            const z1 = Math.sin(angle) * botR;
            const x2 = Math.cos(angle) * topR;
            const z2 = Math.sin(angle) * topR;

            const legGeo = new THREE.CylinderGeometry(0.1, 0.13, towerHeight, 8);
            const leg = new THREE.Mesh(legGeo, matLatticeSteel);
            leg.position.set((x1 + x2) / 2, towerHeight / 2 + 0.35, (z1 + z2) / 2);
            leg.rotation.z = Math.atan2(x1 - x2, towerHeight);
            leg.rotation.x = Math.atan2(z2 - z1, towerHeight);
            leg.castShadow = true;
            pylon.add(leg);
          }

          const levels = 6;
          for (let l = 1; l <= levels; l++) {
            const h = (towerHeight / levels) * l + 0.35;
            const ringR = 1.45 - (l / levels) * 1.03;
            const ring = new THREE.Mesh(new THREE.TorusGeometry(ringR, 0.05, 4, 4), matSteelJoint);
            ring.position.y = h;
            ring.rotation.x = Math.PI / 2;
            pylon.add(ring);
          }

          const armHeights = [towerHeight - 1.2, towerHeight + 0.4];
          const armWidths = [5.2, 3.6];
          const attachmentHooks = [];

          armHeights.forEach((ah, idx) => {
            const w = armWidths[idx];
            const arm = new THREE.Mesh(new THREE.BoxGeometry(w, 0.16, 0.35), matLatticeSteel);
            arm.position.y = ah;
            arm.castShadow = true;
            pylon.add(arm);

            [-w / 2 + 0.3, 0, w / 2 - 0.3].forEach(xOffset => {
              const insGroup = new THREE.Group();
              insGroup.position.set(xOffset, ah - 0.1, 0);

              for (let k = 0; k < 4; k++) {
                const insDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.14, 0.15, 12), matInsulator);
                insDisc.position.y = -(k * 0.18);
                insGroup.add(insDisc);
              }
              pylon.add(insGroup);
              attachmentHooks.push(new THREE.Vector3(x + xOffset, ah - 0.9, z));
            });
          });

          cityWorld.add(pylon);
          return { hooks: attachmentHooks };
        };

        const pylon1 = createTransmissionPylon(-12, 12);
        const pylon2 = createTransmissionPylon(-2, 12);

        // Cabo em catenária (verde-menta) entre dois pontos
        const createCatenaryWire = (p1, p2, sag = 1.4, colorHex = 0x6fa08f) => {
          const points = [];
          const steps = 24;
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            points.push(new THREE.Vector3(
              p1.x + (p2.x - p1.x) * t,
              p1.y + (p2.y - p1.y) * t - Math.sin(t * Math.PI) * sag,
              p1.z + (p2.z - p1.z) * t
            ));
          }
          const curve = new THREE.CatmullRomCurve3(points);
          const cableMat = new THREE.MeshStandardMaterial({
            color: colorHex,
            roughness: 0.2,
            metalness: 0.3,
            emissive: colorHex,
            emissiveIntensity: 0.2
          });
          const wireMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.08, 8, false), cableMat);
          cityWorld.add(wireMesh);
          cityWires.push({ mesh: wireMesh, baseColor: colorHex });
          return curve;
        };

        const mainWireCurves = [];

        [-2, 0, 2].forEach((gx, i) => {

        // Torre 1 -> Torre 2
        for (let i = 0; i < 3; i++) {
          mainWireCurves.push(createCatenaryWire(pylon1.hooks[i], pylon2.hooks[i], 1.6));
        }

        // Chão e ruas da cidade
        const cityGround = new THREE.Mesh(new THREE.BoxGeometry(34, 0.2, 34), new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }));
        cityGround.position.set(8, -0.1, -2);
        cityGround.receiveShadow = true;
        cityWorld.add(cityGround);

        const roadH = new THREE.Mesh(new THREE.BoxGeometry(34, 0.22, 5), matRoad);
        roadH.position.set(8, -0.08, 0);
        roadH.receiveShadow = true;
        cityWorld.add(roadH);

        const roadV = new THREE.Mesh(new THREE.BoxGeometry(5, 0.22, 34), matRoad);
        roadV.position.set(8, -0.08, -2);
        roadV.receiveShadow = true;
        cityWorld.add(roadV);

        for (let r = -8; r <= 24; r += 3.5) {
          const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.24, 0.22), matRoadLine);
          stripe.position.set(r, -0.06, 0);
          cityWorld.add(stripe);
        }

        // Casas e sobrados
        const housePlots = [
          { x: -3, z: -8, color: 0xa35a52, stories: 1 },
          { x: 5, z: -8, color: 0x4a5a7a, stories: 2 },
          { x: 13, z: -8, color: 0xb08a5a, stories: 1 },
          { x: 20, z: -8, color: 0x5f8a7c, stories: 2 },
          { x: -3, z: 8, color: 0x7d6d9a, stories: 2 },
          { x: 5, z: 8, color: 0xa8606c, stories: 1 },
          { x: 13, z: 8, color: 0x5f8aa5, stories: 2 },

          if (plot.stories === 1) {

        const buildPowerPlant = () => {

          plantWorld.add(mainBuildingGroup);

          // 3. Prédio intermediário com ventoinhas no teto
