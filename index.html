          signCtx.fillRect(0, 0, 18, 160);
          signCtx.font = 'bold 84px Arial, sans-serif';
          signCtx.textBaseline = 'middle';
          signCtx.fillText('Treetech', 50, 82);
          signCtx.fillStyle = '#5a6772';
          signCtx.font = '48px Arial, sans-serif';
          signCtx.fillText('Fábrica de módulos', 450, 86);
          const factorySign = new THREE.Mesh(
            new THREE.PlaneGeometry(6, 0.94),
            new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(signCanvas) })
          );
          factorySign.position.set(0, 3.75, -4.06);
          factorySign.rotation.y = Math.PI;
          walls.add(factorySign);
          building.add(walls);

          const roof = new THREE.Group();
          const slope = Math.atan2(2.2, 4.2);
          [-1, 1].forEach(side => {
            const panel = addSlab(roof, 14.8, 0.18, 5.15, roofMat, 0, 0.1 + wallH + 1.15, side * 2.1);
            panel.rotation.x = side * slope;
          });
          addSlab(roof, 14.8, 0.16, 0.3, roofMat, 0, 0.1 + wallH + 2.3, 0);
          building.add(roof);

          // Interior: esteira com módulos, três funcionários na montagem e um supervisor andando
          const furniture = new THREE.Group();
          furniture.position.y = 0.1;
          building.add(furniture);

          const metalMat = mat('#8a949e', 0.5);
          addSlab(furniture, 9.4, 0.1, 0.9, mat('#5a6772', 0.7), 0, 0.85, 0);
          addSlab(furniture, 9.4, 0.08, 0.06, metalMat, 0, 0.97, -0.46, false);
          addSlab(furniture, 9.4, 0.08, 0.06, metalMat, 0, 0.97, 0.46, false);
          [-4.3, -1.4, 1.4, 4.3].forEach(lx => addSlab(furniture, 0.12, 0.8, 0.8, metalMat, lx, 0.4, 0));

          for (let i = 0; i < 7; i++) {
            const { group } = createModuleGroup(1.4);
            group.position.set(-4.7 + i * 1.3, 1.08, 0);
            furniture.add(group);
            factoryBelt.push(group);
          }

          [-3, 0, 3].forEach((wx, i) => {
            const worker = createWorker(['#7fa88c', '#9db8a4', '#6f9a82'][i]);
            worker.position.set(wx, 0.1, 1.15);
            worker.rotation.y = Math.PI;
            worker.userData.leftLeg.rotation.x = 0;
            building.add(worker);
            factoryWorkers.push({ group: worker, phase: i * 1.7 });
          });

          const supervisor = createWorker('#9aa7b8');
          supervisor.position.set(-5.5, 0.1, -2.6);
          building.add(supervisor);
          factoryWalker.group = supervisor;
          factoryWalker.path = makePath([[-5.5, -2.6], [5.5, -2.6]], 'pingpong');

          [[-6.0, 0.35, 2.8], [-5.2, 0.35, 2.8], [-5.6, 0.95, 2.8], [6.0, 0.35, -2.6], [5.2, 0.35, -2.6]].forEach(([cx, cy, cz]) => {
            addSlab(furniture, 0.7, 0.55, 0.7, crateMat, cx, cy, cz);
          });

          [[-5.4, 0.3, -5.5], [-4.5, 0.3, -5.5], [-5.0, 0.9, -5.5], [5.4, 0.3, -5.5]].forEach(([cx, cy, cz]) => {
            addSlab(factoryWorld, 0.8, 0.6, 0.8, crateMat, cx, cy, cz);
          });

          factoryRoof.walls = walls;
          factoryRoof.roof = roof;
          factoryRoof.hit = building;
        };
        buildFactory();

        // Vans da Treetech: saem da fábrica carregadas, vão até o portão da subestação e voltam vazias
        const vans = [];
        const buildVans = () => {
          const path = makePath(
            [[54, 23.0], [54, 18.5], [-3.2, 18.5], [-3.2, 9.8], [-4.8, 9.8], [-4.8, 20.5], [54, 20.5]],
            'loop'
          );
          const deliveredAt = path.segs[3].start + path.segs[3].len;
          const bodyMat = new THREE.MeshStandardMaterial({ color: '#e8ecef', roughness: 0.5 });
          const wheelMat = new THREE.MeshStandardMaterial({ color: '#2b323a', roughness: 0.8 });
          const glass = new THREE.MeshStandardMaterial({ color: '#7f98aa', roughness: 0.3 });
          const crateMat = new THREE.MeshStandardMaterial({ color: '#c9b89a', roughness: 0.7 });

          [0, path.total / 2].forEach(offset => {
            const group = new THREE.Group();
            addSlab(group, 1.0, 0.8, 2.0, bodyMat, 0, 0.62, -0.15);
            addSlab(group, 0.95, 0.6, 0.75, bodyMat, 0, 0.52, 1.0);
            addSlab(group, 0.96, 0.18, 0.5, glass, 0, 0.8, 1.05, false);
            addSlab(group, 1.02, 0.14, 2.1, moduleStripeMat, 0, 0.5, -0.1, false);
            [[-0.5, 0.7], [0.5, 0.7], [-0.5, -0.7], [0.5, -0.7]].forEach(([wx, wz]) => {
              const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.16, 12), wheelMat);
              wheel.rotation.z = Math.PI / 2;
              wheel.position.set(wx, 0.22, wz);
              group.add(wheel);
            });
            const crate = new THREE.Group();
            addSlab(crate, 0.8, 0.5, 0.9, crateMat, 0, 1.27, -0.3);
            addSlab(crate, 0.82, 0.08, 0.92, moduleStripeMat, 0, 1.3, -0.3, false);
            group.add(crate);
            scene.add(group);
            vans.push({ group, crate, path, speed: 4.5, offset, deliveredAt });
          });
        };
        buildVans();

        const updateWorld = (time) => {
          vans.forEach(van => {
            const travelled = time * van.speed + van.offset;
            const s = samplePath(van.path, travelled);
            van.group.position.set(s.x, 0.06, s.z);
            van.group.rotation.y = s.heading;
            const along = ((travelled % van.path.total) + van.path.total) % van.path.total;
            van.crate.visible = along < van.deliveredAt;
          });

          factoryBelt.forEach((module, i) => {
            module.position.x = ((time * 0.6 + i * 1.3) % 9.1) - 4.55;
          });

          factoryWorkers.forEach(worker => {
            const t = time + worker.phase;
            const parts = worker.group.userData;
            parts.leftArm.rotation.x = -0.9 + Math.sin(t * 3) * 0.25;
            parts.rightArm.rotation.x = -0.9 + Math.sin(t * 3 + 1.2) * 0.25;
          });

          if (factoryWalker.group) {
            const travelled = time * 0.8;
            const s = samplePath(factoryWalker.path, travelled);
            factoryWalker.group.position.set(s.x, 0.1, s.z);
            factoryWalker.group.rotation.y = s.heading;
            const swing = Math.sin(travelled * 4.5) * 0.7;
            const parts = factoryWalker.group.userData;
            parts.leftLeg.rotation.x = swing;
            parts.rightLeg.rotation.x = -swing;
            parts.leftArm.rotation.x = -swing * 0.8;
            parts.rightArm.rotation.x = swing * 0.8;
          }
        };

        addLabel('factory', 'Fábrica de módulos', 54, 9.2, 33, 5.2);
        addLabel('treetech', 'Treetech: RabbitMQ, Sigma e banco', 54, 7.6, 8, 6.6);
        addLabel('substation', 'Subestação (módulos instalados)', 0, 9.5, 0, 6.4);
        addLabel('vans', 'Vans levam os módulos', 28, 3.6, 19.5, 4.6);
        addLabel('plant', 'Usuários do Sigma (PCs)', 20.3, 9.5, -1.5, 5.2);
        addLabel('sigma', 'Sigma ECM', 46, 4.7, 5.8, 2.0);
        addLabel('rabbit', 'RabbitMQ', 58, 3.4, 3.4, 1.7);
        addLabel('mast', 'Rede TCP/IP', 2.8, 7.4, 5.3, 2.4);
        setLabels(null);

        // 14. COMUNICAÇÃO SIMULADA: E3 (CONSULTA), SYNC (RABBITMQ), BANCO DE DADOS E SIGMA ECM
        const plantToWorld = (x, y, z) => new THREE.Vector3(16.4 - x, 0.3 + y, -z);

        const netCableMat = new THREE.MeshStandardMaterial({ color: '#5b6772', roughness: 0.5 });
        const addPolyline = (points, radius) => {
          const up = new THREE.Vector3(0, 1, 0);
          for (let i = 0; i < points.length - 1; i++) {
            const a = points[i];
            const b = points[i + 1];
            const dir = new THREE.Vector3().subVectors(b, a);
            const length = dir.length();
            if (length === 0) continue;

            const seg = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 6), netCableMat);
            seg.position.copy(a).add(b).multiplyScalar(0.5);
            seg.quaternion.setFromUnitVectors(up, dir.normalize());
            seg.castShadow = true;
            scene.add(seg);

            if (i > 0) {
              const joint = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 6), netCableMat);
              joint.position.copy(a);
              scene.add(joint);
            }
          }
        };

        // PCs do escritório da usina: usuários do Sigma ECM, ligados ao servidor da Treetech por cabo
        const serverX = TREETECH_POS.x + 1.7;
        const serverTop = new THREE.Vector3(serverX, 1.5, TREETECH_POS.z - 3.7);
        const netCables = [
          { label: 'PC 1', towerX: -3.9, laneZ: 0.25, finalX: serverX + 0.2 },
          { label: 'PC 2', towerX: -2.1, laneZ: 0.15, finalX: serverX },
          { label: 'PC 3', towerX: -0.3, laneZ: 0.05, finalX: serverX - 0.2 }
        ].map(def => {
          const points = [
            plantToWorld(def.towerX, 0.35, 0.45),
            plantToWorld(def.towerX, 0.17, def.laneZ),
            plantToWorld(-5.75, 0.17, def.laneZ),
            new THREE.Vector3(def.finalX, 0.4, -def.laneZ),
            new THREE.Vector3(def.finalX, 0.4, TREETECH_POS.z - 4.5),
            new THREE.Vector3(def.finalX, 0.8, TREETECH_POS.z - 4.05)
          ];
          addPolyline(points, 0.045);

          const lengths = [];
          let length = 0;
          for (let i = 0; i < points.length - 1; i++) {
            length += points[i].distanceTo(points[i + 1]);
            lengths.push(length);
          }
          return { label: def.label, points, lengths, length };
        });

        // Fila do RabbitMQ: tubo de vidro ao lado da Treetech; a altura da pilha é a profundidade
        const MAX_QUEUE_BOXES = 7;
        const queueGroup = new THREE.Group();
        queueGroup.position.set(TREETECH_POS.x + 4, 0.3, TREETECH_POS.z - 6.1);
        scene.add(queueGroup);

        const queueGlassMat = new THREE.MeshStandardMaterial({ color: '#cfe3ea', transparent: true, opacity: 0.28, roughness: 0.1 });
        const queueMetalMat = new THREE.MeshStandardMaterial({ color: '#7a8088', roughness: 0.5 });
        const queueTube = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 2.0, 16), queueGlassMat);
        queueTube.position.y = 1.0;
        queueGroup.add(queueTube);
        const queueBase = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.12, 16), queueMetalMat);
        queueBase.position.y = 0.06;
        queueBase.castShadow = true;
        queueGroup.add(queueBase);
        const queueCap = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16), queueMetalMat);
        queueCap.position.y = 2.05;
        queueGroup.add(queueCap);

        const packetGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const packetMats = {
          msg: new THREE.MeshBasicMaterial({ color: '#d9783a' }),
          query: new THREE.MeshBasicMaterial({ color: '#6ea8c0' }),
          answer: new THREE.MeshBasicMaterial({ color: '#6fbf8a' })
        };

        const queueBoxes = [];
        for (let i = 0; i < MAX_QUEUE_BOXES; i++) {
          const queued = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.22, 0.4), packetMats.msg);
          queued.position.y = 0.25 + i * 0.26;
          queued.visible = false;
          queueGroup.add(queued);
          queueBoxes.push(queued);
        }

        // Arcos de comunicação: módulo -> antena da subestação -> antena da Treetech -> servidor, fila, banco e painel
        const arcLineMat = new THREE.LineBasicMaterial({ color: '#9aa7b2', transparent: true, opacity: 0.6 });
        const makeArc = (a, b, lift) => {
          const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
          mid.y += lift;
          const points = new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone()).getPoints(32);
          const lengths = [];
          let length = 0;
          for (let i = 0; i < points.length - 1; i++) {
            length += points[i].distanceTo(points[i + 1]);
            lengths.push(length);
          }
          const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), arcLineMat.clone());
          scene.add(line);
          return { points, lengths, length, line };
        };

        const moduleKeys = ['tm', 'bm', 'gmp', 'dm1', 'dm2'];
        const moduleLabels = { tm: 'TM', bm: 'BM', gmp: 'GMP', dm1: 'DM 1', dm2: 'DM 2' };
        const arcModule = {};
        moduleKeys.forEach(key => {
          arcModule[key] = makeArc(moduleNodes[key].top, mastSub.top, 2.2);
        });
        const queueTop = new THREE.Vector3(queueGroup.position.x, 2.4, queueGroup.position.z);
        const dashboardPoint = new THREE.Vector3(46, 2.2, 6.0);
        const arcLink = makeArc(mastSub.top, mastTt.top, 16);
        const arcServer = makeArc(mastTt.top, serverTop, 3);
        const arcQueueIn = makeArc(mastTt.top, queueTop, 2);
        const arcQueueOut = makeArc(queueTop, serverTop, 2.5);
        const arcDb = dbNodes.map(db => makeArc(serverTop, db.top, 2.5));
        const arcSigma = dbNodes.map(db => makeArc(db.top, dashboardPoint, 5));

        const net = {
          last: 0, mode: 'sync', depth: 0, flash: 0, activeDb: 0,
          received: 0, saved: 0, shown: 0, recvBucket: 0, savedBucket: 0,
          nextTick: 1, nextDraw: 0, nextConsume: 6, nextPoll: 1, pollIndex: 0, nextDbSwitch: 14,
          nextSend: [1, 2, 3, 4, 5], nextUser: [2, 5, 8],
          history: { recv: [], saved: [] }, events: []
        };

        const applyMode = () => {
          const sync = net.mode === 'sync';
          arcQueueIn.line.visible = sync;
          arcQueueOut.line.visible = sync;
          arcDb.forEach((arc, i) => { arc.line.material.opacity = i === net.activeDb ? 0.7 : 0.15; });
          arcSigma.forEach((arc, i) => { arc.line.material.opacity = i === net.activeDb ? 0.7 : 0.15; });
          dbNodes.forEach((db, i) => db.mat.color.set(i === net.activeDb ? '#9fc9ad' : '#cfd6dc'));
        };

        const cablePoint = (cable, dist) => {
          const d = Math.min(Math.max(dist, 0), cable.length);
          let i = cable.lengths.findIndex(l => d <= l);
          if (i < 0) i = cable.lengths.length - 1;
          const start = i === 0 ? 0 : cable.lengths[i - 1];
          const segLen = cable.lengths[i] - start;
          const t = segLen === 0 ? 0 : (d - start) / segLen;
          return new THREE.Vector3().lerpVectors(cable.points[i], cable.points[i + 1], t);
        };

        const formatClock = (time) =>
          `${String(Math.floor(time / 60)).padStart(2, '0')}:${String(Math.floor(time % 60)).padStart(2, '0')}`;

        const logEvent = (time, text) => {
          net.events.unshift(`${formatClock(time)}  ${text}`);
          net.events.length = Math.min(net.events.length, 6);
        };

        // Um pacote percorre uma lista de trechos (dir = 1 segue o trecho; dir = -1 volta por ele)
        const journeys = [];
        const enterStep = (journey) => {
          const step = journey.steps[journey.index];
          journey.mesh.material = packetMats[step.kind] || packetMats.msg;
          journey.mesh.scale.setScalar(step.scale || 1.5);
          journey.dist = step.dir > 0 ? 0 : step.path.length;
        };
        const startJourney = (steps) => {
          const mesh = new THREE.Mesh(packetGeo, packetMats.msg);
          scene.add(mesh);
          const journey = { mesh, steps, index: 0, dist: 0 };
          enterStep(journey);
          journeys.push(journey);
        };

        const flashModule = (key) => { moduleNodes[key].flash = 0.3; };

        // Depois de recebida (Sync ou E3), a informação é gravada no banco e aparece no Sigma ECM
        const saveAndShowSteps = (kind) => {
          const db = net.activeDb;
          return [
            {
              path: arcDb[db], dir: 1, kind,
              done: (time) => { net.saved += 1; net.savedBucket += 1; logEvent(time, `gravado: ${DB_NAMES[db]}`); }
            },
            { path: arcSigma[db], dir: 1, kind, scale: 1.0, done: () => { net.shown += 1; } }
          ];
        };

        const sendSync = (key) => {
          startJourney([
            { path: arcModule[key], dir: 1, kind: 'msg', done: () => flashModule(key) },
            { path: arcLink, dir: 1, kind: 'msg' },
            {
              path: arcQueueIn, dir: 1, kind: 'msg',
              done: (time) => {
                net.depth = Math.min(net.depth + 1, 99);
                net.received += 1;
                net.recvBucket += 1;
                logEvent(time, `${moduleLabels[key]} enviou (Sync)`);
              }
            }
          ]);
        };

        const consumeQueue = () => {
          net.depth -= 1;
          startJourney([
            { path: arcQueueOut, dir: 1, kind: 'msg', done: (time) => { net.flash = 0.25; logEvent(time, 'Sigma tirou da fila'); } },
            ...saveAndShowSteps('msg')
          ]);
        };

        const pollE3 = (key) => {
          startJourney([
            { path: arcServer, dir: -1, kind: 'query' },
            { path: arcLink, dir: -1, kind: 'query' },
            {
              path: arcModule[key], dir: -1, kind: 'query',
              done: (time) => { flashModule(key); logEvent(time, `Sigma consultou ${moduleLabels[key]} (E3)`); }
            },
            { path: arcModule[key], dir: 1, kind: 'answer' },
            { path: arcLink, dir: 1, kind: 'answer' },
            {
              path: arcServer, dir: 1, kind: 'answer',
              done: () => { net.flash = 0.25; net.received += 1; net.recvBucket += 1; }
            },
            ...saveAndShowSteps('answer')
          ]);
        };

        const userSession = (cable) => {
          startJourney([
            { path: cable, dir: 1, kind: 'query', scale: 1, speed: 6 },
            {
              path: cable, dir: -1, kind: 'answer', scale: 1, speed: 6,
              done: (time) => logEvent(time, `${cable.label} abriu o Sigma ECM`)
            }
          ]);
        };

        // Dashboard do painel de telas: uma imagem de 1920 x 600 dividida em 4 x 2 telas por molduras escuras
        const drawDashboard = () => {
          const { ctx, texture, width: W, height: H } = treetechDashboard;
          if (!ctx) return;
          const tileW = W / 4;
          const tileH = H / 2;
          const orange = '#d9783a';
          const blue = '#6ea8c0';
          const green = '#6fbf8a';
          const grey = '#8aa0b2';
          const white = '#eef2f5';
          const sync = net.mode === 'sync';

          ctx.fillStyle = '#0f1720';
          ctx.fillRect(0, 0, W, H);
          ctx.textBaseline = 'top';

          const title = (text, col, row) => {
            ctx.fillStyle = grey;
            ctx.font = 'bold 24px Arial, sans-serif';
            ctx.fillText(text.toUpperCase(), col * tileW + 28, row * tileH + 22);
          };
          const avg = (list, n) => {
            const last = list.slice(-n);
            return last.length ? last.reduce((sum, v) => sum + v, 0) / last.length : 0;
          };

          title('Sigma ECM  |  Comunicação', 0, 0);
          ctx.fillStyle = sync ? orange : blue;
          ctx.font = 'bold 120px Arial, sans-serif';
          ctx.fillText(sync ? 'Sync' : 'E3', 28, 70);
          ctx.fillStyle = grey;
          ctx.font = '30px Arial, sans-serif';
          ctx.fillText(sync ? 'módulo envia (RabbitMQ)' : 'Sigma consulta (TCP/IP)', 28, 215);
          ctx.fillText(`${avg(net.history.recv, 5).toFixed(1)} leituras / s`, 28, 255);

          title('Fila RabbitMQ', 1, 0);
          ctx.fillStyle = white;
          ctx.font = 'bold 120px Arial, sans-serif';
          ctx.fillText(String(net.depth), tileW + 28, 70);
          ctx.fillStyle = grey;
          ctx.font = '32px Arial, sans-serif';
          ctx.fillText('mensagens na fila', tileW + 28, 205);
          ctx.fillStyle = '#1f2b36';
          ctx.fillRect(tileW + 28, 255, tileW - 56, 16);
          ctx.fillStyle = orange;
          ctx.fillRect(tileW + 28, 255, ((tileW - 56) * Math.min(net.depth, MAX_QUEUE_BOXES)) / MAX_QUEUE_BOXES, 16);

          title('Módulos', 2, 0);
          const closed = breakerClosedRef.current;
          const load = loadLevelRef.current;
          [
            ['TM', `óleo ${Math.round(55 + load * 0.25)} °C`],
            ['BM', 'buchas normais'],
            ['GMP', `umidade ${Math.round(6 + load / 20)} ppm`],
            ['DM', closed ? 'contatos fechados' : 'contatos abertos']
          ].forEach(([name, value], i) => {
            const y = 74 + i * 54;
            ctx.fillStyle = green;
            ctx.beginPath();
            ctx.arc(2 * tileW + 40, y + 16, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = white;
            ctx.font = 'bold 30px Arial, sans-serif';
            ctx.fillText(name, 2 * tileW + 64, y);
            ctx.fillStyle = grey;
            ctx.font = '28px Arial, sans-serif';
            ctx.fillText(value, 2 * tileW + 150, y + 2);
          });

          title('Subestação', 3, 0);
          ctx.fillStyle = closed ? green : '#c26a62';
          ctx.font = 'bold 42px Arial, sans-serif';
          ctx.fillText(closed ? 'Disjuntor fechado' : 'Disjuntor aberto', 3 * tileW + 28, 76);
          ctx.fillStyle = white;
          ctx.font = 'bold 92px Arial, sans-serif';
          ctx.fillText(`${closed ? Math.round(48 * load / 100) : 0} MW`, 3 * tileW + 28, 130);
          ctx.fillStyle = grey;
          ctx.font = '30px Arial, sans-serif';
          ctx.fillText(`carga ${load}%`, 3 * tileW + 28, 245);

          title('Leituras por segundo (60 s)', 0, 1);
          const chartLeft = 28;
          const chartRight = 2 * tileW - 28;
          const chartTop = tileH + 80;
          const chartBottom = H - 34;
          const maxValue = Math.max(3, ...net.history.recv, ...net.history.saved);
          ctx.strokeStyle = '#26333f';
          ctx.lineWidth = 2;
          for (let g = 0; g <= 3; g++) {
            const gy = chartTop + ((chartBottom - chartTop) * g) / 3;
            ctx.beginPath();
            ctx.moveTo(chartLeft, gy);
            ctx.lineTo(chartRight, gy);
            ctx.stroke();
          }
          const plot = (series, color) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = 5;
            ctx.beginPath();
            const offset = 60 - series.length;
            series.forEach((value, i) => {
              const x = chartLeft + ((chartRight - chartLeft) * (i + offset)) / 59;
              const y = chartBottom - ((chartBottom - chartTop) * value) / maxValue;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();
          };
          plot(net.history.recv, sync ? orange : blue);
          plot(net.history.saved, green);

          title('Banco de dados', 2, 1);
          ctx.fillStyle = white;
          ctx.font = 'bold 44px Arial, sans-serif';
          ctx.fillText(DB_NAMES[net.activeDb], 2 * tileW + 28, tileH + 62);
          [['recebidas', net.received], ['gravadas', net.saved], ['exibidas', net.shown]].forEach(([label, value], i) => {
            ctx.fillStyle = grey;
            ctx.font = '28px Arial, sans-serif';
            ctx.fillText(label, 2 * tileW + 28, tileH + 128 + i * 46);
            ctx.fillStyle = white;
            ctx.font = 'bold 34px Arial, sans-serif';
            ctx.fillText(String(value), 2 * tileW + 230, tileH + 124 + i * 46);
          });

          title('Eventos', 3, 1);
          ctx.fillStyle = white;
          ctx.font = '23px Arial, sans-serif';
          net.events.forEach((event, i) => ctx.fillText(event, 3 * tileW + 28, tileH + 66 + i * 36));

          ctx.strokeStyle = '#05080b';
          ctx.lineWidth = 10;
          for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(i * tileW, 0);
            ctx.lineTo(i * tileW, H);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.moveTo(0, tileH);
          ctx.lineTo(W, tileH);
          ctx.stroke();
          ctx.strokeRect(5, 5, W - 10, H - 10);

          texture.needsUpdate = true;
        };

        applyMode();
        drawDashboard();

        const updateNetwork = (time) => {
          const dt = Math.min(time - net.last, 0.1);
          net.last = time;

          if (time >= net.nextTick) {
            net.nextTick = time + 1;
            net.history.recv.push(net.recvBucket);
            net.history.saved.push(net.savedBucket);
            net.recvBucket = 0;
            net.savedBucket = 0;
            if (net.history.recv.length > 60) net.history.recv.shift();
            if (net.history.saved.length > 60) net.history.saved.shift();
          }
          if (time >= net.nextDraw) {
            net.nextDraw = time + 0.5;
            drawDashboard();
          }
          if (time >= net.nextDbSwitch) {
            net.nextDbSwitch = time + 14;
            net.activeDb = 1 - net.activeDb;
            applyMode();
          }

          if (net.mode === 'sync') {
            moduleKeys.forEach((key, i) => {
              if (time < net.nextSend[i]) return;
              net.nextSend[i] = time + 3 + Math.random() * 4;
              sendSync(key);
            });
          } else if (time >= net.nextPoll) {
            net.nextPoll = time + 1.4;
            pollE3(moduleKeys[net.pollIndex % moduleKeys.length]);
            net.pollIndex += 1;
          }

          if (time >= net.nextConsume) {
            if (net.depth > 0) {
              consumeQueue();
              net.nextConsume = time + 0.9;
            } else {
              net.nextConsume = time + 0.4;
            }
          }

          netCables.forEach((cable, i) => {
            if (time < net.nextUser[i]) return;
            net.nextUser[i] = time + 6 + Math.random() * 5;
            userSession(cable);
          });

          for (let i = journeys.length - 1; i >= 0; i--) {
            const journey = journeys[i];
            const step = journey.steps[journey.index];
            journey.dist += step.dir * (step.speed || 14) * dt;
            const finished = step.dir > 0 ? journey.dist >= step.path.length : journey.dist <= 0;
            if (finished) {
              if (step.done) step.done(time);
              journey.index += 1;
              if (journey.index >= journey.steps.length) {
                scene.remove(journey.mesh);
                journeys.splice(i, 1);
                continue;
              }
              enterStep(journey);
            }
            const active = journey.steps[journey.index];
            journey.mesh.position.copy(cablePoint(active.path, journey.dist));
            journey.mesh.position.y += active.path.line ? 0 : 0.12;
          }

          queueBoxes.forEach((box, i) => { box.visible = i < net.depth; });
          net.flash = Math.max(0, net.flash - dt);
          if (treetechLed.mesh) treetechLed.mesh.material.color.set(net.flash > 0 ? '#ffffff' : '#6fbf8a');
          moduleKeys.forEach(key => {
            const node = moduleNodes[key];
            node.flash = Math.max(0, node.flash - dt);
            node.led.material.color.set(node.flash > 0 ? '#ffffff' : '#6fbf8a');
          });
        };

        // Interface com o React: o tour liga o modo, abre os telhados e escolhe os rótulos
        const roofByName = { plant: plantRoof, treetech: treetechRoof, factory: factoryRoof };
        sceneApiRef.current = {
          setMode: (mode) => {
            if (net.mode !== mode) {
              journeys.forEach(journey => scene.remove(journey.mesh));
              journeys.length = 0;
              net.depth = 0;
            }
            net.mode = mode;
            applyMode();
          },
          setRoofs: (state) => {
            Object.keys(state).forEach(name => {
              if (roofByName[name]) roofByName[name].open = state[name];
            });
          },
          setLabels
        };

        // --- SISTEMA DE SELEÇÃO E RAYCASTING (CLIQUE NOS COMPONENTES) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const handleClick = (event) => {
          if (event.target !== renderer.domElement) return;
          mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(substationGroup.children, true);

          if (intersects.length > 0) {
            let obj = intersects[0].object;
            while (obj.parent && obj.parent !== substationGroup && !obj.name) {
              obj = obj.parent;
            }
            if (obj.name && componentData[obj.name]) {
              setSelectedComponent(obj.name);
            }
          }
        };

        window.addEventListener('click', handleClick);

        // Clique no escritório da usina abre/fecha o telhado (ignora cliques depois de arrastar a câmera)
        const plantRaycaster = new THREE.Raycaster();
        const plantMouse = new THREE.Vector2();
        let pressX = 0;
        let pressY = 0;
        const handlePressStart = (event) => {
          pressX = event.clientX;
          pressY = event.clientY;
        };
        const handleOfficeClick = (event) => {
          if (event.target !== renderer.domElement) return;
          if (Math.hypot(event.clientX - pressX, event.clientY - pressY) > 5) return;
          plantMouse.x = (event.clientX / window.innerWidth) * 2 - 1;
          plantMouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
          plantRaycaster.setFromCamera(plantMouse, camera);
          const hit = plantRaycaster.intersectObjects(scene.children, true)[0];
          roofToggles.forEach(toggle => {
            let node = hit ? hit.object : null;
            while (node && node !== toggle.hit) node = node.parent;
            if (node) toggle.open = !toggle.open;
          });
        };
        window.addEventListener('pointerdown', handlePressStart);
        window.addEventListener('click', handleOfficeClick);

        // Redimensionamento de tela
        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);

        // LOOP DE ANIMAÇÃO 3D
        let animationFrameId;
        const clock = new THREE.Clock();

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const time = clock.getElapsedTime();

          controls.update();

          // Animação de partículas de energia fluindo pelos cabos
          particleSystemsRef.current.forEach(p => {
            const { curve, speed } = p.userData;
            p.userData.progress = (p.userData.progress + speed) % 1;
            const posArr = p.geometry.attributes.position.array;

            for (let i = 0; i < 5; i++) {
              const t = (p.userData.progress + i * 0.18) % 1;
              const pt = curve.getPoint(t);
              posArr[i * 3] = pt.x;
              posArr[i * 3 + 1] = pt.y;
              posArr[i * 3 + 2] = pt.z;
            }
            p.geometry.attributes.position.needsUpdate = true;
          });

          // Escritório da usina: pessoas sentadas digitando, uma pessoa andando e o telhado abrindo
          plantSeated.forEach(s => {
            const t = time + s.phase;
            const parts = s.worker.userData;
            parts.leftArm.rotation.x = -1.0 + Math.sin(t * 9) * 0.08;
            parts.rightArm.rotation.x = -1.0 + Math.sin(t * 9 + 1.3) * 0.08;
            parts.head.rotation.x = Math.sin(t * 0.7) * 0.08;
          });
          [plantOfficeWalker, treetechWalker].forEach(officeWalker => {
            if (!officeWalker.group) return;
            const travelled = time * 0.8;
            const s = samplePath(officeWalker.path, travelled);
            officeWalker.group.position.set(s.x, 0.1, s.z);
            officeWalker.group.rotation.y = s.heading;

            const swing = Math.sin(travelled * 4.5) * 0.7;
            const parts = officeWalker.group.userData;
            parts.leftLeg.rotation.x = swing;
            parts.rightLeg.rotation.x = -swing;
            parts.leftArm.rotation.x = -swing * 0.8;
            parts.rightArm.rotation.x = swing * 0.8;
          });
          roofToggles.forEach(toggle => {
            toggle.amount += ((toggle.open ? 1 : 0) - toggle.amount) * 0.12;
            if (toggle.walls) toggle.walls.scale.y = 1 - 0.7 * toggle.amount;
            if (toggle.roof) toggle.roof.visible = !toggle.open;
          });

          updateWorld(time);
          updateNetwork(time);

          // Usina: ventoinhas girando e fumaça nas chaminés
          plantFans.forEach(fan => {
            fan.rotation.y += 0.25;
          });
          plantSteam.forEach(p => {
            p.position.y += p.userData.speed;
            p.position.x += Math.sin(time * 2 + p.position.y) * 0.005;
            p.scale.addScalar(p.userData.scaleSpeed);
            p.material.opacity -= 0.004;

            if (p.material.opacity <= 0 || p.position.y > p.userData.baseY + 3.0) {
              p.position.y = p.userData.baseY;
              p.position.x = p.userData.emitterX + (Math.random() - 0.5) * 0.2;
              p.position.z = p.userData.emitterZ + (Math.random() - 0.5) * 0.2;
              p.scale.set(1, 1, 1);
              p.material.opacity = 0.45;
            }
          });

          // Cidade: pulsos, cabos e janelas seguem o estado do disjuntor
          const cityOn = breakerClosedRef.current;
          cityPulses.forEach(p => {
            p.visible = cityOn;
            if (cityOn) {
              p.userData.progress = (p.userData.progress + p.userData.speed) % 1;
              p.position.copy(p.userData.curve.getPoint(p.userData.progress));
            }
          });
          cityWires.forEach(w => {
            w.mesh.material.color.setHex(cityOn ? w.baseColor : 0x64748b);
            w.mesh.material.emissive.setHex(cityOn ? w.baseColor : 0x000000);
          });
          cityWindows.forEach(win => win.material.color.setHex(cityOn ? 0xf3e6a8 : 0x334155));

          // Pessoas caminhando: posição pela distância percorrida, passos sincronizados com ela
          walkers.forEach(w => {
            const travelled = time * w.speed + w.offset;
            const s = samplePath(w.path, travelled);
            w.group.position.set(s.x, 0.35, s.z);
            w.group.rotation.y = s.heading;

            const swing = Math.sin(travelled * 4.5) * 0.7;
            const { leftLeg, rightLeg, leftArm, rightArm } = w.group.userData;
            leftLeg.rotation.x = swing;
            rightLeg.rotation.x = -swing;
            leftArm.rotation.x = -swing * 0.8;
            rightArm.rotation.x = swing * 0.8;
          });

          // Animação suave de pulso do transformador quando energizado
          if (breakerClosed && componentMeshesRef.current['transformer']) {
            const trafo = componentMeshesRef.current['transformer'];
            const vibe = Math.sin(time * 30) * 0.002 * (loadLevel / 100);
            trafo.position.y = vibe;
          }

          renderer.render(scene, camera);
        };

        animate();

        // Cleanup
        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('click', handleClick);
          window.removeEventListener('pointerdown', handlePressStart);
          window.removeEventListener('click', handleOfficeClick);
          cancelAnimationFrame(animationFrameId);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      // Atualizar Modos de Renderização (Normal, Raio-X, Térmico, Noturno)
      useEffect(() => {
        if (!sceneRef.current) return;
        const scene = sceneRef.current;

        scene.traverse((child) => {
          if (child.isMesh) {
            if (viewMode === 'xray') {
              child.material.wireframe = true;
              child.material.transparent = true;
              child.material.opacity = 0.6;
            } else if (viewMode === 'thermal') {
              child.material.wireframe = false;
              child.material.transparent = false;

              // Simular assinatura de calor termográfica
              if (child.parent && child.parent.name === 'transformer') {
                child.material.color.setHex(0xef4444); // Quente (Vermelho/Laranja)
              } else if (child.parent && child.parent.name === 'radiators') {
                child.material.color.setHex(0xf97316);
              } else {
                child.material.color.setHex(0x3b82f6); // Frio (Azul)
              }
            } else {
              // Modo Normal / Noturno
              child.material.wireframe = false;
              child.material.transparent = false;
              child.material.opacity = 1.0;
            }
          }
        });

        if (viewMode === 'night') {
          scene.background = new THREE.Color('#070b12');
        } else {
          scene.background = new THREE.Color('#dbeafe');
        }
      }, [viewMode]);

      // Alternar Ângulos de Câmera
      const setCameraPreset = (preset) => {
        if (!controlsRef.current) return;
        const controls = controlsRef.current;

        switch (preset) {
          case 'overview':
            controls.object.position.set(109, 75, 84);
            controls.target.set(29, 0, 4);
            break;
          case 'plant':
            controls.object.position.set(40, 22, 28);
            controls.target.set(16.4, 3, 0);
            break;
          case 'interior':
            plantRoofApiRef.current.setOpen(true);
            controls.object.position.set(25, 12, -12.8);
            controls.target.set(19, 0.8, -1.8);
            break;
          case 'network':
            controls.object.position.set(60, 24, 26);
            controls.target.set(38, 0.5, 3);
            break;
          case 'factory':
            sceneApiRef.current.setRoofs({ factory: true });
            controls.object.position.set(68, 16, 47);
            controls.target.set(54, 1, 33);
            break;
          case 'dashboard':
            treetechRoofApiRef.current.setOpen(true);
            controls.object.position.set(46, 7, 17);
            controls.target.set(46, 2.1, 5.7);
            break;
          case 'treetech':
            treetechRoofApiRef.current.setOpen(true);
            controls.object.position.set(66, 14, 23);
            controls.target.set(54, 1, 8);
            break;
          case 'city':
            controls.object.position.set(80, 32, 14);
            controls.target.set(54, 2, -18.5);
            break;
          case 'iso':
            controls.object.position.set(22, 18, 22);
            controls.target.set(0, 2.5, 0);
            break;
          case 'top':
            controls.object.position.set(0, 30, 0.1);
            controls.target.set(0, 0, 0);
            break;
          case 'trafo':
            controls.object.position.set(5, 4, 6);
            controls.target.set(0, 2, 0);
            setSelectedComponent('transformer');
            break;
          case 'gantry':
            controls.object.position.set(0, 8, -12);
            controls.target.set(0, 5, -4.5);
            setSelectedComponent('gantry');
            break;
          default:
            break;
        }
      };

      // Tour guiado: move a câmera, escolhe o modo de comunicação, abre os telhados e mostra os rótulos do passo
      const goToTourStep = (index) => {
        const step = TOUR_STEPS[index];
        if (!step || !controlsRef.current) return;
        const controls = controlsRef.current;
        controls.object.position.set(...step.camera.position);
        controls.target.set(...step.camera.target);
        sceneApiRef.current.setMode(step.mode);
        sceneApiRef.current.setRoofs(step.roofs);
        sceneApiRef.current.setLabels(step.labels);
        setTourStep(index);
      };

      const endTour = () => {
        setTourStep(null);
        sceneApiRef.current.setMode('sync');
        sceneApiRef.current.setLabels(null);
      };

      // Alternar Estado do Disjuntor Principal
      const toggleBreaker = () => {
        const newState = !breakerClosed;
        setBreakerClosed(newState);

        if (!newState) {
          setAlarms(prev => [
            { id: Date.now(), msg: "ALERTA: Disjuntor Principal Abertura de Emergência!", time: new Date().toLocaleTimeString() },
            ...prev
          ]);
        } else {
          setAlarms(prev => [
            { id: Date.now(), msg: "SISTEMA: Disjuntor Reagrupado e Energizado.", time: new Date().toLocaleTimeString() },
            ...prev
          ]);
        }
      };

      return (
        <div className="relative w-full h-screen pointer-events-none select-none text-slate-100 flex flex-col justify-between p-4">

          {/* CONTROLES RÁPIDOS */}
          <header className="pointer-events-none flex justify-end">
            {/* BARRA DE CONTROLES RÁPIDOS */}
            <div className="pointer-events-auto flex items-center gap-2 bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-xl p-2 shadow-2xl">
              <button
                onClick={toggleBreaker}
                className={`px-3 py-2 rounded-lg font-bold text-xs transition-all shadow-lg flex items-center gap-2 ${
                  breakerClosed
                    ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-rose-900/40'
                    : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/40'
                }`}
              >
                <Icons.Zap />
                {breakerClosed ? 'DESENERGIZAR DISJUNTOR' : 'ENERGIZAR SUBESTAÇÃO'}
              </button>
            </div>
          </header>

          {/* PAINEL CENTRAL DE VISUALIZAÇÃO E TELEMETRIA */}
          <div className="flex justify-between items-start gap-4 my-auto">

            {/* PAINEL ESQUERDO: SELEÇÃO DE VISTAS E MODOS */}
            <div className="pointer-events-auto bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-xl p-3 flex flex-col gap-3 w-48 shadow-xl">
              <button onClick={() => goToTourStep(0)} className="px-2 py-2 bg-emerald-600 hover:bg-emerald-500 rounded text-xs font-bold text-white">
                Tour: como funciona
              </button>
              <div className="text-xs font-bold text-slate-400 tracking-wider uppercase border-b border-slate-800 pb-1.5 flex items-center gap-1.5">
                <Icons.Camera /> Câmera Presets
              </div>
              <div className="grid grid-cols-2 gap-1.5">
                <button onClick={() => setCameraPreset('overview')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Visão Geral</button>
                <button onClick={() => setCameraPreset('city')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Cidade</button>
                <button onClick={() => setCameraPreset('plant')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Usina</button>
                <button onClick={() => setCameraPreset('interior')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Interior</button>
                <button onClick={() => setCameraPreset('treetech')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Treetech</button>
                <button onClick={() => setCameraPreset('network')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Rede</button>
                <button onClick={() => setCameraPreset('dashboard')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Painel</button>
                <button onClick={() => setCameraPreset('factory')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Fábrica</button>
                <button onClick={() => setCameraPreset('iso')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Isométrica</button>
                <button onClick={() => setCameraPreset('top')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Planta Baixa</button>
                <button onClick={() => setCameraPreset('trafo')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Trafo 01</button>
                <button onClick={() => setCameraPreset('gantry')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Pórtico AT</button>
              </div>

              <div className="text-xs font-bold text-slate-400 tracking-wider uppercase border-b border-slate-800 pb-1.5 mt-2 flex items-center gap-1.5">
                <Icons.Eye /> Modos de Render
              </div>
              <div className="flex flex-col gap-1.5">
                <button onClick={() => setViewMode('normal')} className={`px-2.5 py-1.5 rounded text-xs text-left border ${viewMode === 'normal' ? 'bg-sky-600/30 border-sky-500 text-sky-200' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>Standard 3D</button>
                <button onClick={() => setViewMode('xray')} className={`px-2.5 py-1.5 rounded text-xs text-left border ${viewMode === 'xray' ? 'bg-sky-600/30 border-sky-500 text-sky-200' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>Raio-X (Wireframe)</button>
                <button onClick={() => setViewMode('thermal')} className={`px-2.5 py-1.5 rounded text-xs text-left border ${viewMode === 'thermal' ? 'bg-sky-600/30 border-sky-500 text-sky-200' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>Termografia IR</button>
                <button onClick={() => setViewMode('night')} className={`px-2.5 py-1.5 rounded text-xs text-left border ${viewMode === 'night' ? 'bg-sky-600/30 border-sky-500 text-sky-200' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>Visão Noturna</button>
              </div>
            </div>

            {/* CARD DE DETALHES DO COMPONENTE SELECIONADO (DIREITA) */}
            {selectedComponent && componentData[selectedComponent] && (
              <div className="pointer-events-auto bg-slate-900/90 backdrop-blur-md border border-slate-700 rounded-xl p-4 w-80 shadow-2xl animate-fade-in">
                <div className="flex justify-between items-start border-b border-slate-800 pb-2 mb-3">
                  <h3 className="font-bold text-sm text-amber-400">{componentData[selectedComponent].title}</h3>
                  <button onClick={() => setSelectedComponent(null)} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-300 mb-3 leading-relaxed">{componentData[selectedComponent].desc}</p>

                <div className="space-y-2 text-xs bg-slate-950/60 p-3 rounded-lg border border-slate-800">
                  {componentData[selectedComponent].voltage && (
                    <div className="flex justify-between"><span className="text-slate-400">Tensão Operacional:</span><span className="font-mono text-sky-300">{componentData[selectedComponent].voltage}</span></div>
                  )}
                  {componentData[selectedComponent].power && (
                    <div className="flex justify-between"><span className="text-slate-400">Potência Nominal:</span><span className="font-mono text-emerald-300">{componentData[selectedComponent].power}</span></div>
                  )}
                  {componentData[selectedComponent].temp && (
                    <div className="flex justify-between"><span className="text-slate-400">Temperatura Estimada:</span><span className="font-mono text-amber-300">{componentData[selectedComponent].temp}</span></div>
                  )}
                  <div className="flex justify-between"><span className="text-slate-400">Status Operacional:</span><span className="font-mono text-indigo-300">{componentData[selectedComponent].status}</span></div>
                </div>
              </div>
            )}
          </div>


          {/* PAINEL DO TOUR GUIADO */}
          {tourStep !== null && (
            <div className="pointer-events-auto fixed left-1/2 -translate-x-1/2 bottom-24 w-[34rem] max-w-[92vw] bg-slate-900/95 backdrop-blur-md border border-emerald-500/50 rounded-xl p-4 shadow-2xl">
              <div className="flex items-center justify-between mb-1">
                <span className="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">
                  Tour: como funciona · passo {tourStep + 1} de {TOUR_STEPS.length}
                </span>
                <button onClick={endTour} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
              </div>
              <h3 className="font-bold text-base text-white mb-1">{TOUR_STEPS[tourStep].title}</h3>
              <p className="text-xs text-slate-300 leading-relaxed mb-3">{TOUR_STEPS[tourStep].text}</p>
              <div className="flex items-center justify-between">
                <div className="flex gap-1.5">
                  {TOUR_STEPS.map((_, i) => (
                    <span key={i} className={`w-2 h-2 rounded-full ${i === tourStep ? 'bg-emerald-400' : 'bg-slate-600'}`} />
                  ))}
                </div>
                <div className="flex gap-2">
                  <button
                    disabled={tourStep === 0}
                    onClick={() => goToTourStep(tourStep - 1)}
                    className="px-3 py-1.5 rounded bg-slate-800 border border-slate-700 text-xs text-slate-200 disabled:opacity-40"
                  >
                    Anterior
                  </button>
                  {tourStep < TOUR_STEPS.length - 1 ? (
                    <button
                      onClick={() => goToTourStep(tourStep + 1)}
                      className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white"
                    >
                      Próximo
                    </button>
                  ) : (
                    <button onClick={endTour} className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white">
                      Concluir
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Renderização do App React
    ReactDOM.createRoot(document.getElementById('root')).render(<SubstationApp />);
  </script>
</body>
</html>
