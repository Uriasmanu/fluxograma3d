          factoryRoof.hit = building;
        };
        buildFactory();

        // Vans da Treetech: saem da fábrica carregadas, vão até o portão da subestação e voltam vazias
        const vans = [];
        const buildVans = () => {
          const path = makePath(
            [[54, 23.0], [54, 18.5], [-3.2, 18.5], [-3.2, 9.8], [-4.8, 9.8], [-4.8, 20.5], [54, 20.5]],
            'loop'
          );
          const deliveredAt = path.segs[3].start + path.segs[3].len;
          const bodyMat = new THREE.MeshStandardMaterial({ color: '#e8ecef', roughness: 0.5 });
          const wheelMat = new THREE.MeshStandardMaterial({ color: '#2b323a', roughness: 0.8 });
          const glass = new THREE.MeshStandardMaterial({ color: '#7f98aa', roughness: 0.3 });
          const crateMat = new THREE.MeshStandardMaterial({ color: '#c9b89a', roughness: 0.7 });

          [0, path.total / 2].forEach(offset => {
            const group = new THREE.Group();
            addSlab(group, 1.0, 0.8, 2.0, bodyMat, 0, 0.62, -0.15);
            addSlab(group, 0.95, 0.6, 0.75, bodyMat, 0, 0.52, 1.0);
            addSlab(group, 0.96, 0.18, 0.5, glass, 0, 0.8, 1.05, false);
            addSlab(group, 1.02, 0.14, 2.1, moduleStripeMat, 0, 0.5, -0.1, false);
            addVehicleLights(group, 1.4, -1.17, 0.5, 0.3);
            [[-0.5, 0.7], [0.5, 0.7], [-0.5, -0.7], [0.5, -0.7]].forEach(([wx, wz]) => {
              const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.16, 12), wheelMat);
              wheel.rotation.z = Math.PI / 2;
              wheel.position.set(wx, 0.22, wz);
              group.add(wheel);
            });
            const crate = new THREE.Group();
            addSlab(crate, 0.8, 0.5, 0.9, crateMat, 0, 1.27, -0.3);
            addSlab(crate, 0.82, 0.08, 0.92, moduleStripeMat, 0, 1.3, -0.3, false);
            group.add(crate);
            scene.add(group);
            vans.push({ group, crate, path, speed: 4.5, offset, deliveredAt });
          });
        };
        buildVans();

        // Cidade viva: carros na avenida e moradores nas calçadas
        const cityCars = [];
        const cityPeople = [];
        const buildCityLife = () => {
          const wheelMat = new THREE.MeshStandardMaterial({ color: '#2b323a', roughness: 0.8 });
          const glassMat = new THREE.MeshStandardMaterial({ color: '#7f98aa', roughness: 0.3 });
          const carPath = makePath([[-8, 1.2], [24, 1.2], [24, -1.2], [-8, -1.2]], 'loop');
          [['#a8606c', 0, 3.2], ['#5f8aa5', 23, 2.6], ['#c9b87a', 46, 3.6]].forEach(([color, offset, speed]) => {
            const car = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.45 });
            addSlab(car, 0.9, 0.35, 1.9, bodyMat, 0, 0.38, 0);
            addSlab(car, 0.8, 0.3, 1.0, bodyMat, 0, 0.7, -0.1);
            addSlab(car, 0.82, 0.2, 0.9, glassMat, 0, 0.72, -0.1, false);
            [[-0.45, 0.6], [0.45, 0.6], [-0.45, -0.6], [0.45, -0.6]].forEach(([wx, wz]) => {
              const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.14, 12), wheelMat);
              wheel.rotation.z = Math.PI / 2;
              wheel.position.set(wx, 0.2, wz);
              car.add(wheel);
            });
            addVehicleLights(car, 0.96, -0.96, 0.42, 0.3);
            cityWorld.add(car);
            cityCars.push({ group: car, path: carPath, speed, offset });
          });

          [
            ['#c8a07a', [[-7, 3.8], [22, 3.8]], 0.9, 0],
            ['#8aa0c0', [[22, -3.8], [-7, -3.8]], 1.1, 12],
            ['#b88a9a', [[-7, 3.8], [22, 3.8]], 0.8, 40],
            ['#9ab88a', [[22, -3.8], [-7, -3.8]], 1.0, 33]
          ].forEach(([color, points, speed, offset]) => {
            const person = createWorker(color);
            person.userData.helmet.visible = false;
            person.scale.setScalar(0.7);
            cityWorld.add(person);
            cityPeople.push({ group: person, path: makePath(points, 'pingpong'), speed, offset });
          });
        };
        buildCityLife();

        const updateWorld = (time) => {
          cityCars.forEach(car => {
            const s = samplePath(car.path, time * car.speed + car.offset);
            car.group.position.set(s.x, 0.03, s.z);
            car.group.rotation.y = s.heading;
          });

          cityPeople.forEach(person => {
            const travelled = time * person.speed + person.offset;
            const s = samplePath(person.path, travelled);
            person.group.position.set(s.x, 0.02, s.z);
            person.group.rotation.y = s.heading;
            const swing = Math.sin(travelled * 5) * 0.7;
            const parts = person.group.userData;
            parts.leftLeg.rotation.x = swing;
            parts.rightLeg.rotation.x = -swing;
            parts.leftArm.rotation.x = -swing * 0.8;
            parts.rightArm.rotation.x = swing * 0.8;
          });

          vans.forEach(van => {
            const travelled = time * van.speed + van.offset;
            const s = samplePath(van.path, travelled);
            van.group.position.set(s.x, 0.06, s.z);
            van.group.rotation.y = s.heading;
            const along = ((travelled % van.path.total) + van.path.total) % van.path.total;
            van.crate.visible = along < van.deliveredAt;
          });

          factoryBelt.forEach((module, i) => {
            module.position.x = ((time * 0.6 + i * 1.3) % 9.1) - 4.55;
          });

          if (prototyper.update) prototyper.update(time);
          if (officeLife.update) officeLife.update(time);
          if (homeLife.update) homeLife.update(time);
          if (installer.update) installer.update(time);

          factoryWorkers.forEach(worker => {
            const t = time + worker.phase;
            const parts = worker.group.userData;
            parts.leftArm.rotation.x = -0.9 + Math.sin(t * 3) * 0.25;
            parts.rightArm.rotation.x = -0.9 + Math.sin(t * 3 + 1.2) * 0.25;
          });

          if (factoryWalker.group) {
            const travelled = time * 0.8;
            const s = samplePath(factoryWalker.path, travelled);
            factoryWalker.group.position.set(s.x, 0.1, s.z);
            factoryWalker.group.rotation.y = s.heading;
            const swing = Math.sin(travelled * 4.5) * 0.7;
            const parts = factoryWalker.group.userData;
            parts.leftLeg.rotation.x = swing;
            parts.rightLeg.rotation.x = -swing;
            parts.leftArm.rotation.x = -swing * 0.8;
            parts.rightArm.rotation.x = swing * 0.8;
          }
        };

        addLabel('factory', 'Fábrica de módulos', 54, 9.2, 33, 5.2);
        addLabel('treetech', 'Treetech: RabbitMQ, Sigma e banco', 54, 7.6, 8, 6.6);
        addLabel('substation', 'Subestação (módulos instalados)', 0, 9.5, 0, 6.4);
        addLabel('vans', 'Vans levam os módulos', 28, 3.6, 19.5, 4.6);
        addLabel('plant', 'Usuários do Sigma (PCs)', 20.3, 9.5, -1.5, 5.2);
        addLabel('sigma', 'Sigma ECM', 46, 4.7, 5.8, 2.0);
        addLabel('rabbit', 'RabbitMQ', 58, 3.4, 3.4, 1.7);
        addLabel('mast', 'Rede TCP/IP', 2.8, 7.4, 5.3, 2.4);
        setLabels(null);

        // 14. COMUNICAÇÃO SIMULADA: E3 (CONSULTA), SYNC (RABBITMQ), BANCO DE DADOS E SIGMA ECM
        const plantToWorld = (x, y, z) => new THREE.Vector3(16.4 - x, 0.3 + y, -z);

        const netCableMat = new THREE.MeshStandardMaterial({ color: '#5b6772', roughness: 0.5 });
        const addPolyline = (points, radius) => {
          const up = new THREE.Vector3(0, 1, 0);
          for (let i = 0; i < points.length - 1; i++) {
            const a = points[i];
            const b = points[i + 1];
            const dir = new THREE.Vector3().subVectors(b, a);
            const length = dir.length();
            if (length === 0) continue;

            const seg = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 6), netCableMat);
            seg.position.copy(a).add(b).multiplyScalar(0.5);
            seg.quaternion.setFromUnitVectors(up, dir.normalize());
            seg.castShadow = true;
            scene.add(seg);

            if (i > 0) {
              const joint = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 6), netCableMat);
              joint.position.copy(a);
              scene.add(joint);
            }
          }
        };

        // PCs do escritório da usina: usuários do Sigma ECM, ligados ao servidor da Treetech por cabo
        const serverX = TREETECH_POS.x + 1.7;
        const serverTop = new THREE.Vector3(serverX, 1.5, TREETECH_POS.z - 3.7);
        const netCables = [
          { label: 'PC 1', towerX: -3.9, laneZ: 0.25, finalX: serverX + 0.2 },
          { label: 'PC 2', towerX: -2.1, laneZ: 0.15, finalX: serverX },
          { label: 'PC 3', towerX: -0.3, laneZ: 0.05, finalX: serverX - 0.2 }
        ].map(def => {
          const points = [
            plantToWorld(def.towerX, 0.35, 0.45),
            plantToWorld(def.towerX, 0.17, def.laneZ),
            plantToWorld(-5.75, 0.17, def.laneZ),
            new THREE.Vector3(def.finalX, 0.4, -def.laneZ),
            new THREE.Vector3(def.finalX, 0.4, TREETECH_POS.z - 4.5),
            new THREE.Vector3(def.finalX, 0.8, TREETECH_POS.z - 4.05)
          ];
          addPolyline(points, 0.045);

          const lengths = [];
          let length = 0;
          for (let i = 0; i < points.length - 1; i++) {
            length += points[i].distanceTo(points[i + 1]);
            lengths.push(length);
          }
          return { label: def.label, points, lengths, length };
        });

        // Fila do RabbitMQ: tubo de vidro ao lado da Treetech; a altura da pilha é a profundidade
        const MAX_QUEUE_BOXES = 7;
        const queueGroup = new THREE.Group();
        queueGroup.position.set(TREETECH_POS.x + 4, 0.3, TREETECH_POS.z - 6.1);
        scene.add(queueGroup);

        const queueGlassMat = new THREE.MeshStandardMaterial({ color: '#cfe3ea', transparent: true, opacity: 0.28, roughness: 0.1 });
        queueGlassMat.userData.preserve = true;
        const queueMetalMat = new THREE.MeshStandardMaterial({ color: '#7a8088', roughness: 0.5 });
        const queueTube = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 2.0, 16), queueGlassMat);
        queueTube.position.y = 1.0;
        queueGroup.add(queueTube);
        const queueBase = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.12, 16), queueMetalMat);
        queueBase.position.y = 0.06;
        queueBase.castShadow = true;
        queueGroup.add(queueBase);
        const queueCap = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16), queueMetalMat);
        queueCap.position.y = 2.05;
        queueGroup.add(queueCap);

        const packetGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const packetMats = {
          msg: new THREE.MeshBasicMaterial({ color: '#d9783a' }),
          query: new THREE.MeshBasicMaterial({ color: '#6ea8c0' }),
          answer: new THREE.MeshBasicMaterial({ color: '#6fbf8a' })
        };

        const queueBoxes = [];
        for (let i = 0; i < MAX_QUEUE_BOXES; i++) {
          const queued = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.22, 0.4), packetMats.msg);
          queued.position.y = 0.25 + i * 0.26;
          queued.visible = false;
          queueGroup.add(queued);
          queueBoxes.push(queued);
        }

        // Arcos de comunicação: módulo -> antena da subestação -> antena da Treetech -> servidor, fila, banco e painel
        const arcLineMat = new THREE.LineBasicMaterial({ color: '#9aa7b2', transparent: true, opacity: 0.6 });
        const makeArc = (a, b, lift) => {
          const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
          mid.y += lift;
          const points = new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone()).getPoints(32);
          const lengths = [];
          let length = 0;
          for (let i = 0; i < points.length - 1; i++) {
            length += points[i].distanceTo(points[i + 1]);
            lengths.push(length);
          }
          const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), arcLineMat.clone());
          scene.add(line);
          return { points, lengths, length, line };
        };

        const moduleKeys = ['tm', 'bm', 'gmp', 'dm1', 'dm2'];
        const moduleLabels = { tm: 'TM', bm: 'BM', gmp: 'GMP', dm1: 'DM 1', dm2: 'DM 2' };
        const arcModule = {};
        moduleKeys.forEach(key => {
          arcModule[key] = makeArc(moduleNodes[key].top, mastSub.top, 2.2);
        });
        const queueTop = new THREE.Vector3(queueGroup.position.x, 2.4, queueGroup.position.z);
        const dashboardPoint = new THREE.Vector3(46, 2.2, 6.0);
        const arcLink = makeArc(mastSub.top, mastTt.top, 16);
        const arcServer = makeArc(mastTt.top, serverTop, 3);
        const arcQueueIn = makeArc(mastTt.top, queueTop, 2);
        const arcQueueOut = makeArc(queueTop, serverTop, 2.5);
        const arcDb = dbNodes.map(db => makeArc(serverTop, db.top, 2.5));
        const arcSigma = dbNodes.map(db => makeArc(db.top, dashboardPoint, 5));

        const net = {
          last: 0, mode: 'sync', depth: 0, flash: 0, activeDb: 0,
          received: 0, saved: 0, shown: 0, recvBucket: 0, savedBucket: 0,
          nextTick: 1, nextDraw: 0, nextConsume: 6, nextPoll: 1, pollIndex: 0, nextDbSwitch: 14,
          nextSend: [1, 2, 3, 4, 5], nextUser: [2, 5, 8],
          history: { recv: [], saved: [] }, events: []
        };

        const applyMode = () => {
          const sync = net.mode === 'sync';
          arcQueueIn.line.visible = sync;
          arcQueueOut.line.visible = sync;
          arcDb.forEach((arc, i) => { arc.line.material.opacity = i === net.activeDb ? 0.7 : 0.15; });
          arcSigma.forEach((arc, i) => { arc.line.material.opacity = i === net.activeDb ? 0.7 : 0.15; });
          dbNodes.forEach((db, i) => db.mat.color.set(i === net.activeDb ? '#9fc9ad' : '#cfd6dc'));
        };

        const cablePoint = (cable, dist) => {
          const d = Math.min(Math.max(dist, 0), cable.length);
          let i = cable.lengths.findIndex(l => d <= l);
          if (i < 0) i = cable.lengths.length - 1;
          const start = i === 0 ? 0 : cable.lengths[i - 1];
          const segLen = cable.lengths[i] - start;
          const t = segLen === 0 ? 0 : (d - start) / segLen;
          return new THREE.Vector3().lerpVectors(cable.points[i], cable.points[i + 1], t);
        };

        const formatClock = (time) =>
          `${String(Math.floor(time / 60)).padStart(2, '0')}:${String(Math.floor(time % 60)).padStart(2, '0')}`;

        const logEvent = (time, text) => {
          net.events.unshift(`${formatClock(time)}  ${text}`);
          net.events.length = Math.min(net.events.length, 6);
        };

        // Um pacote percorre uma lista de trechos (dir = 1 segue o trecho; dir = -1 volta por ele)
        const journeys = [];
        const enterStep = (journey) => {
          const step = journey.steps[journey.index];
          journey.mesh.material = packetMats[step.kind] || packetMats.msg;
          journey.mesh.scale.setScalar(step.scale || 1.5);
          journey.dist = step.dir > 0 ? 0 : step.path.length;
        };
        const startJourney = (steps) => {
          const mesh = new THREE.Mesh(packetGeo, packetMats.msg);
          scene.add(mesh);
          const journey = { mesh, steps, index: 0, dist: 0 };
          enterStep(journey);
          journeys.push(journey);
        };

        const flashModule = (key) => { moduleNodes[key].flash = 0.3; };

        // Depois de recebida (Sync ou E3), a informação é gravada no banco e aparece no Sigma ECM
        const saveAndShowSteps = (kind) => {
          const db = net.activeDb;
          return [
            {
              path: arcDb[db], dir: 1, kind,
              done: (time) => { net.saved += 1; net.savedBucket += 1; logEvent(time, `gravado: ${DB_NAMES[db]}`); }
            },
            { path: arcSigma[db], dir: 1, kind, scale: 1.0, done: () => { net.shown += 1; } }
          ];
        };

        const sendSync = (key) => {
          startJourney([
            { path: arcModule[key], dir: 1, kind: 'msg', done: () => flashModule(key) },
            { path: arcLink, dir: 1, kind: 'msg' },
            {
              path: arcQueueIn, dir: 1, kind: 'msg',
              done: (time) => {
                net.depth = Math.min(net.depth + 1, 99);
                net.received += 1;
                net.recvBucket += 1;
                logEvent(time, `${moduleLabels[key]} enviou (Sync)`);
              }
            }
          ]);
        };

        const consumeQueue = () => {
          net.depth -= 1;
          startJourney([
            { path: arcQueueOut, dir: 1, kind: 'msg', done: (time) => { net.flash = 0.25; logEvent(time, 'Sigma tirou da fila'); } },
            ...saveAndShowSteps('msg')
          ]);
        };

        const pollE3 = (key) => {
          startJourney([
            { path: arcServer, dir: -1, kind: 'query' },
            { path: arcLink, dir: -1, kind: 'query' },
            {
              path: arcModule[key], dir: -1, kind: 'query',
              done: (time) => { flashModule(key); logEvent(time, `Sigma consultou ${moduleLabels[key]} (E3)`); }
            },
            { path: arcModule[key], dir: 1, kind: 'answer' },
            { path: arcLink, dir: 1, kind: 'answer' },
            {
              path: arcServer, dir: 1, kind: 'answer',
              done: () => { net.flash = 0.25; net.received += 1; net.recvBucket += 1; }
            },
            ...saveAndShowSteps('answer')
          ]);
        };

        const userSession = (cable) => {
          startJourney([
            { path: cable, dir: 1, kind: 'query', scale: 1, speed: 6 },
            {
              path: cable, dir: -1, kind: 'answer', scale: 1, speed: 6,
              done: (time) => logEvent(time, `${cable.label} abriu o Sigma ECM`)
            }
          ]);
        };

        // Dashboard do painel de telas: uma imagem de 1920 x 600 dividida em 4 x 2 telas por molduras escuras
        const drawDashboard = () => {
          const { ctx, texture, width: W, height: H } = treetechDashboard;
          if (!ctx) return;
          if (failureSim.active) {
            if (failureSim.exploded) failureSim.paintAlert(ctx, W, H, net.last);
            else failureSim.paintDashboard(ctx, W, H, net.last);
            texture.needsUpdate = true;
            return;
          }
          const tileW = W / 4;
          const tileH = H / 2;
          const orange = '#d9783a';
          const blue = '#6ea8c0';
          const green = '#6fbf8a';
          const grey = '#8aa0b2';
          const white = '#eef2f5';
          const sync = net.mode === 'sync';

          ctx.fillStyle = '#0f1720';
          ctx.fillRect(0, 0, W, H);
          ctx.textBaseline = 'top';

          const title = (text, col, row) => {
            ctx.fillStyle = grey;
            ctx.font = 'bold 24px Arial, sans-serif';
            ctx.fillText(text.toUpperCase(), col * tileW + 28, row * tileH + 22);
          };
          const avg = (list, n) => {
            const last = list.slice(-n);
            return last.length ? last.reduce((sum, v) => sum + v, 0) / last.length : 0;
          };

          title('Sigma ECM  |  Comunicação', 0, 0);
          ctx.fillStyle = sync ? orange : blue;
          ctx.font = 'bold 120px Arial, sans-serif';
          ctx.fillText(sync ? 'Sync' : 'E3', 28, 70);
          ctx.fillStyle = grey;
          ctx.font = '30px Arial, sans-serif';
          ctx.fillText(sync ? 'módulo envia (RabbitMQ)' : 'Sigma consulta (TCP/IP)', 28, 215);
          ctx.fillText(`${avg(net.history.recv, 5).toFixed(1)} leituras / s`, 28, 255);

          title('Fila RabbitMQ', 1, 0);
          ctx.fillStyle = white;
          ctx.font = 'bold 120px Arial, sans-serif';
          ctx.fillText(String(net.depth), tileW + 28, 70);
          ctx.fillStyle = grey;
          ctx.font = '32px Arial, sans-serif';
          ctx.fillText('mensagens na fila', tileW + 28, 205);
          ctx.fillStyle = '#1f2b36';
          ctx.fillRect(tileW + 28, 255, tileW - 56, 16);
          ctx.fillStyle = orange;
          ctx.fillRect(tileW + 28, 255, ((tileW - 56) * Math.min(net.depth, MAX_QUEUE_BOXES)) / MAX_QUEUE_BOXES, 16);

          title('Módulos', 2, 0);
          const closed = breakerClosedRef.current;
          const load = loadLevelRef.current;
          [
            ['TM', `óleo ${Math.round(55 + load * 0.25)} °C`],
            ['BM', 'buchas normais'],
            ['GMP', `umidade ${Math.round(6 + load / 20)} ppm`],
            ['DM', closed ? 'contatos fechados' : 'contatos abertos']
          ].forEach(([name, value], i) => {
            const y = 74 + i * 54;
            ctx.fillStyle = green;
            ctx.beginPath();
            ctx.arc(2 * tileW + 40, y + 16, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = white;
            ctx.font = 'bold 30px Arial, sans-serif';
            ctx.fillText(name, 2 * tileW + 64, y);
            ctx.fillStyle = grey;
            ctx.font = '28px Arial, sans-serif';
            ctx.fillText(value, 2 * tileW + 150, y + 2);
          });

          title('Subestação', 3, 0);
          ctx.fillStyle = closed ? green : '#c26a62';
          ctx.font = 'bold 42px Arial, sans-serif';
          ctx.fillText(closed ? 'Disjuntor fechado' : 'Disjuntor aberto', 3 * tileW + 28, 76);
          ctx.fillStyle = white;
          ctx.font = 'bold 92px Arial, sans-serif';
          ctx.fillText(`${closed ? Math.round(48 * load / 100) : 0} MW`, 3 * tileW + 28, 130);
          ctx.fillStyle = grey;
          ctx.font = '30px Arial, sans-serif';
          ctx.fillText(`carga ${load}%`, 3 * tileW + 28, 245);

          title('Leituras por segundo (60 s)', 0, 1);
          const chartLeft = 28;
          const chartRight = 2 * tileW - 28;
          const chartTop = tileH + 80;
          const chartBottom = H - 34;
          const maxValue = Math.max(3, ...net.history.recv, ...net.history.saved);
          ctx.strokeStyle = '#26333f';
          ctx.lineWidth = 2;
          for (let g = 0; g <= 3; g++) {
            const gy = chartTop + ((chartBottom - chartTop) * g) / 3;
            ctx.beginPath();
            ctx.moveTo(chartLeft, gy);
            ctx.lineTo(chartRight, gy);
            ctx.stroke();
          }
          const plot = (series, color) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = 5;
            ctx.beginPath();
            const offset = 60 - series.length;
            series.forEach((value, i) => {
              const x = chartLeft + ((chartRight - chartLeft) * (i + offset)) / 59;
              const y = chartBottom - ((chartBottom - chartTop) * value) / maxValue;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();
          };
          plot(net.history.recv, sync ? orange : blue);
          plot(net.history.saved, green);

          title('Banco de dados', 2, 1);
          ctx.fillStyle = white;
          ctx.font = 'bold 44px Arial, sans-serif';

        const updateNetwork = (time) => {

            net.nextTick = time + 1;
            net.history.recv.push(net.recvBucket);
            net.history.saved.push(net.savedBucket);
            net.recvBucket = 0;
            net.savedBucket = 0;
            if (net.history.recv.length > 60) net.history.recv.shift();
            if (net.history.saved.length > 60) net.history.saved.shift();
          }
          if (time >= net.nextDraw) {
            net.nextDraw = time + (failureSim.active ? 0.2 : 0.5);
            drawDashboard();
          }
          if (time >= net.nextDbSwitch) {
            net.nextDbSwitch = time + 14;
            net.activeDb = 1 - net.activeDb;
            applyMode();
          }

              net.nextSend[i] = time + 3 + Math.random() * 4;
              sendSync(key);

            net.nextPoll = time + 1.4;
            pollE3(moduleKeys[net.pollIndex % moduleKeys.length]);
            net.pollIndex += 1;
          }

          if (time >= net.nextConsume) {
            if (net.depth > 0) {

            } else {

            const finished = step.dir > 0 ? journey.dist >= step.path.length : journey.dist <= 0;
            if (finished) {
              if (step.done) step.done(time);
              journey.index += 1;
              if (journey.index >= journey.steps.length) {
                scene.remove(journey.mesh);
                journeys.splice(i, 1);
                continue;
              }
              enterStep(journey);
            }
            const active = journey.steps[journey.index];
            journey.mesh.position.copy(cablePoint(active.path, journey.dist));
            journey.mesh.position.y += active.path.line ? 0 : 0.12;

          queueBoxes.forEach((box, i) => { box.visible = i < net.depth; });
          net.flash = Math.max(0, net.flash - dt);

          moduleKeys.forEach(key => {

        // Fim de tarde: sol baixo e alaranjado, céu em degradê, postes, janelas e faróis acesos

        // CENÁRIO DE FALHA: alarmes, fumaça, explosão do transformador, destruição da usina, apagão e restauração gradual
        const failureCtl = (() => {

          const trafoGroup = componentMeshesRef.current['transformer'];
          const ALERTS = [

          const dustPool = makePool(70, sphereGeo, () => new THREE.MeshBasicMaterial({ color: '#b9b2a6', transparent: true, opacity: 0, depthWrite: false }));

          const emit = (pool, x, y, z, vx, vy, vz, life, s0, grow, op) => {

              cone.position.set((i - 1) * 0.18 * size, 0.55 * size * (1 - i * 0.2), (i % 2) * 0.15 * size);

              if (Math.abs(p.vel.y) > 2) p.vel.y *= -0.35;
              else p.vel.y = 0;
              p.vel.x *= 0.7;
              p.vel.z *= 0.7;
              p.ang.multiplyScalar(0.6);
              if (Math.hypot(p.vel.x, p.vel.z) < 0.3 && p.vel.y === 0) p.rest = true;
            }
          });

          // ---------- ruínas ----------
          const burnt = new THREE.MeshBasicMaterial({ color: '#141414', transparent: true, opacity: 0.88, depthWrite: false });
          const wreck = new THREE.Group();
          wreck.visible = false;
          root.add(wreck);
          const burnDisc = new THREE.Mesh(new THREE.CircleGeometry(4.8, 28), burnt);
          burnDisc.rotation.x = -Math.PI / 2;
          burnDisc.position.y = 0.37;
          wreck.add(burnDisc);
          const wreckMat = new THREE.MeshStandardMaterial({ color: '#232323', roughness: 0.9 });
          const addWreck = (w, h, d, x, y, z, rx, rz) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wreckMat);
            m.position.set(x, y, z);
            m.rotation.set(rx || 0, 0, rz || 0);
            m.castShadow = true;
            wreck.add(m);
          };
          addWreck(3.2, 0.5, 2.4, 0, 0.6, 0, 0, 0);
          addWreck(1.4, 0.9, 0.12, -1.1, 1.1, 1.0, 0.3, 0.1);
          addWreck(0.12, 0.8, 1.6, 1.5, 0.9, -0.3, 0, -0.35);
          addWreck(1.0, 0.1, 1.1, 0.5, 1.1, -0.5, 0.2, 0.15);
          [-1.0, -0.4, 0.2, 0.8].forEach((x, i) => addWreck(0.12, 1.1 - i * 0.2, 1.4, x, 0.7, -2.0, 0.1 * i, 0.12 * (i - 1.5)));
          const wreckFires = [makeFire(wreck, 0, 0.9, 0, 2.2), makeFire(wreck, -1.1, 0.8, 0.5, 1.5), makeFire(wreck, 1.0, 0.8, -0.6, 1.7), makeFire(wreck, 0.2, 0.7, -2.0, 1.2), makeFire(wreck, 1.6, 0.6, 1.0, 1.0)];

          const buildingDefs = [
            { key: 'main', c: [-3.2, -3.2], size: [4.6, 4.6], h: 7 },
            { key: 'mid', c: [1.5, -3.2], size: [4.4, 4.4], h: 5 },
            { key: 'office', c: [-2.6, 1.8], size: [5.8, 4.2], h: 3 }
          ];
          const collapses = buildingDefs.map(def => {
            const wx = 16.4 - def.c[0];
            const wz = -def.c[1];
            const ruin = new THREE.Group();
            ruin.position.set(def.c[0], 0, def.c[1]);
            ruin.visible = false;
            plantWorld.add(ruin);
            const disc = new THREE.Mesh(new THREE.CircleGeometry(Math.max(def.size[0], def.size[1]) * 0.62, 20), burnt);
            disc.rotation.x = -Math.PI / 2;
            disc.position.y = 0.04;
            ruin.add(disc);
            for (let i = 0; i < 16; i++) {
              const m = new THREE.Mesh(new THREE.BoxGeometry(rnd(0.4, 1.4), rnd(0.15, 0.9), rnd(0.4, 1.4)), i % 3 === 0 ? wreckMat : concreteMat);
              m.position.set(rnd(-def.size[0] / 2, def.size[0] / 2) * 0.9, 0.3, rnd(-def.size[1] / 2, def.size[1] / 2) * 0.9);
              m.rotation.set(rnd(-0.4, 0.4), rnd(0, 3), rnd(-0.4, 0.4));
              m.castShadow = true;
              ruin.add(m);
            }
            const ruinFires = [makeFire(ruin, -def.size[0] * 0.2, 0.4, 0, 1.6), makeFire(ruin, def.size[0] * 0.25, 0.4, def.size[1] * 0.2, 1.2), makeFire(ruin, 0, 0.4, -def.size[1] * 0.25, 1.4)];
            return { def, wx, wz, dist: Math.hypot(wx, wz), ruin, ruinFires, started: false, tc: 0 };
          });

          const attached = [moduleNodes.tm.group, moduleNodes.bm.group, moduleNodes.gmp.group, gmpPipe, labelSprites.tm, labelSprites.bm, labelSprites.gmp].filter(Boolean);
          const flash = document.createElement('div');
          flash.style.cssText = 'position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;';
          document.body.appendChild(flash);
          const vignette = document.createElement('div');
          vignette.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;box-shadow:inset 0 0 180px 40px rgba(220,20,20,0.75);';
          document.body.appendChild(vignette);

          const knocked = [];
          const knock = (obj, ownerFlag) => {
            const away = obj.position.clone().setY(0);
            if (away.lengthSq() < 0.01) away.set(1, 0, 0);
            away.normalize();
            knocked.push({ obj, start: obj.position.clone(), dir: away, t: 0, flag: ownerFlag });
          };
          const evac = [];
          plantSeated.forEach(s => evac.push({ obj: s.worker, at: rnd(2, FAIL_SECONDS - 4), back: rnd(8, 16) }));
          if (plantOfficeWalker.group) evac.push({ obj: plantOfficeWalker.group, at: rnd(2, FAIL_SECONDS - 4), back: rnd(8, 16) });

          // ---------- vans: deixam de ir até a subestação depois da explosão ----------
          const vanPathOriginal = vans.length ? vans[0].path : null;
          const vanDeliveredOriginal = vans.length ? vans[0].deliveredAt : 0;
          const vanPathDetour = makePath([[54, 23.0], [54, 18.5], [10, 18.5], [10, 20.5], [54, 20.5]], 'loop');
          const rerouteVans = (time, toDetour) => vans.forEach(van => {
            const target = toDetour ? vanPathDetour : vanPathOriginal;
            if (!target || van.path === target) return;
            const trav = time * van.speed + van.offset;
            const along = ((trav % van.path.total) + van.path.total) % van.path.total;
            if (along > 40) return;
            van.path = target;
            van.offset = along - time * van.speed;
            van.deliveredAt = toDetour ? 1e9 : vanDeliveredOriginal;
          });

          const ui = (force) => {
            let rem = 0;
            if (st.phase === 'countdown') rem = Math.max(0, Math.ceil(FAIL_SECONDS - st.t));
            if (st.phase === 'restoring') rem = Math.round(100 * Math.min(1, st.tr / RESTORE_SECONDS));
            const alertIdx = Math.floor(st.t / 3.2);
            if (!force && rem === st.lastRem && alertIdx === st.lastAlert) return;
            st.lastRem = rem;
            st.lastAlert = alertIdx;
            const stack = [];
            for (let i = 0; i < 3; i++) if (alertIdx - i >= 0 && st.phase === 'countdown') stack.push(ALERTS[(alertIdx - i) % ALERTS.length]);
            if (failureUiRef.current) failureUiRef.current({ phase: st.phase, remaining: rem, alerts: stack });
          };

          const setShown = (list, visible) => list.forEach(o => { o.visible = visible; });

          const explode = (time) => {
            st.phase = 'exploded';
            st.te = 0;
            st.cam = null;
            st.breakerDone = false;
            failureSim.exploded = true;
            trafoGroup.visible = false;
            setShown(attached, false);
            if (installer.props) installer.props.visible = false;
            wreck.visible = true;
            wreck.scale.set(1, 1, 1);
            wreckFires.forEach(f => {
              f.group.visible = true;
              f.amount = 1;
            });
            st.shake = 1;
            flash.style.transition = 'none';
            flash.style.opacity = '1';
            requestAnimationFrame(() => {
              flash.style.transition = 'opacity 1.4s ease-out';
              flash.style.opacity = '0';
            });
            for (let i = 0; i < 70; i++) launch(debris[i], rnd(-1.2, 1.2), rnd(1, 3.5), rnd(-1, 1), 17, 20);
            for (let i = 0; i < 60; i++) emit(sparkPool, rnd(-1, 1), rnd(1.5, 3), rnd(-1, 1), rnd(-14, 14), rnd(4, 18), rnd(-14, 14), rnd(0.8, 1.8), 1, 0, 1);
            for (let i = 0; i < 40; i++) emit(smokePool, rnd(-1.5, 1.5), rnd(1.5, 4), rnd(-1.5, 1.5), rnd(-3, 3), rnd(2, 6), rnd(-3, 3), rnd(4, 7), 1.2, 3.2, 0.7);
            if (installer.rig) {
              installer.disabled = true;
              knock(installer.rig, 'installer');
            }
            walkers.forEach(w => {
              if (Math.hypot(w.group.position.x, w.group.position.z) < 11) {
                w.knocked = true;
                knock(w.group, 'walker');
              }
            });
            particleSystemsRef.current.forEach(p => { p.visible = false; });
            ui(true);
          };

          const startCollapse = (c) => {
            c.started = true;
            c.tc = 0;
            for (let i = 0; i < 18; i++) emit(dustPool, c.wx + rnd(-2, 2), 0.8 + rnd(0, 3), c.wz + rnd(-2, 2), rnd(-2, 2), rnd(0.5, 3), rnd(-2, 2), rnd(2.5, 4.5), 1.5, 3.5, 0.65);
            const free = debris.slice(70).filter(p => p.rest || !p.mesh.visible);
            free.slice(0, 13).forEach(p => launch(p, c.wx + rnd(-1.5, 1.5), rnd(2, c.def.h), c.wz + rnd(-1.5, 1.5), 8, 12));
          };

          return {
            shake,
            start: () => {
              if (st.phase !== 'idle') return;
              st.phase = 'countdown';
              st.t = 0;
              st.breakerDone = false;
              st.lastRem = -1;
              st.lastAlert = -1;
              failureSim.active = true;
              failureSim.exploded = false;
              failureSim.elapsed = 0;
              failureSim.mode = 'normal';
              failureSim.remaining = FAIL_SECONDS;
              st.beaconsOn = false;
              try {
                const mq = failureSim.mqTexture;
                if (mq) st.mqSnap = mq.image.getContext('2d').getImageData(0, 0, 512, 320);
              } catch (e) {
                st.mqSnap = null;
              }
              setAlarms(prev => [{ id: Date.now(), msg: 'FALHA CRÍTICA: Trafo 01 em sobretemperatura. Explosão iminente!', time: new Date().toLocaleTimeString() }, ...prev]);
              ui(true);
            },
            abort: () => {
              if (st.phase !== 'countdown') return;
              st.phase = 'aborting';
              st.ta = 0;
              st.heat = matTrafo.emissiveIntensity;
              failureSim.active = false;
              failureSim.elapsed = 0;
              beacons.forEach(b => { b.g.visible = false; });
              arcs.forEach(a => { a.line.visible = false; });
              alarmLight.intensity = 0;
              vignette.style.opacity = '0';
              evac.forEach(e => { e.obj.visible = true; });
              try {
                const mq = failureSim.mqTexture;
                if (mq && st.mqSnap) {
                  mq.image.getContext('2d').putImageData(st.mqSnap, 0, 0);
                  mq.needsUpdate = true;
                }
              } catch (e) {
                // sem restauração da tela
              }
              setAlarms(prev => [{ id: Date.now(), msg: 'SISTEMA: Falha desativada. Trafo 01 estabilizado.', time: new Date().toLocaleTimeString() }, ...prev]);
              ui(true);
            },
            restore: () => {
              if (st.phase !== 'exploded') return;
              st.phase = 'restoring';
              st.tr = 0;
              st.screensBack = false;
              st.knockReleased = false;
              failureSim.mode = 'restore';
              failureSim.waveR = 0;
              beacons.forEach(b => { b.g.visible = false; });
              alarmLight.intensity = 0;
              setBreakerClosed(true);
              setAlarms(prev => [{ id: Date.now(), msg: 'SISTEMA: Restauração da subestação iniciada.', time: new Date().toLocaleTimeString() }, ...prev]);
              ui(true);
            },
            update: (time) => {
              const dt = Math.min(0.1, Math.max(0, time - st.last));
              st.last = time;
              stepPool(smokePool, dt, 0.35);
              stepPool(dustPool, dt, 0.05);
              stepPool(sparkPool, dt, -14);
              stepDebris(dt);
              updateFires(time);
              beacons.forEach(b => {
                if (!b.g.visible) return;
                b.spin.rotation.y = time * 5;
                b.lamp.material.color.set(Math.floor(time * 4) % 2 ? '#ff2a2a' : '#ff9a9a');
              });
              shake.set(0, 0, 0);
              if (st.phase === 'idle') {
                rerouteVans(time, false);
                return;
              }

              if (st.phase === 'aborting') {
                st.ta += dt;
                const k = 1 - ss(0, 3, st.ta);
                matTrafo.emissiveIntensity = st.heat * k;
                matRadiator.emissiveIntensity = st.heat * 0.8 * k;
                trafoGroup.position.x *= 0.9;
                trafoGroup.scale.lerp(V3(1, 1, 1), 0.1);
                st.shake = 0;
                st.smoke += dt * 14 * k;
                while (st.smoke >= 1) {
                  st.smoke -= 1;
                  emit(smokePool, rnd(-1.2, 1.2), rnd(2.6, 3.8), rnd(-0.8, 0.6), rnd(0.2, 1.0), rnd(1.2, 2.2), rnd(-0.3, 0.3), rnd(2.5, 3.5), rnd(0.3, 0.5), rnd(1.2, 2), 0.35);
                }
                if (st.ta >= 3) {
                  st.phase = 'idle';
                  st.t = 0;
                  matTrafo.emissive.setHex(0x000000);
                  matTrafo.emissiveIntensity = 0;
                  matRadiator.emissive.setHex(0x000000);
                  matRadiator.emissiveIntensity = 0;
                  trafoGroup.position.x = 0;
                  trafoGroup.scale.set(1, 1, 1);
                  ui(true);
                } else ui(false);
              } else if (st.phase === 'countdown') {
                st.t += dt;
                failureSim.elapsed = st.t * (60 / FAIL_SECONDS);
                failureSim.remaining = FAIL_SECONDS - st.t;
                const p = Math.min(1, Math.max(0, st.t - INTRO) / (FAIL_SECONDS - INTRO));
                if (st.t >= INTRO && !st.beaconsOn) {
                  st.beaconsOn = true;
                  beacons.forEach(b => { b.g.visible = true; });
                  treetechRoof.open = false;
                }
                if (st.t >= INTRO && st.t < INTRO + 3.5) {
                  const k = 1 - Math.exp(-dt * 1.8);
                  controls.object.position.lerp(ISO_POS, k);
                  controls.target.lerp(ISO_TARGET, k);
                }
                const pulse = 0.5 + 0.5 * Math.sin(time * (4 + 10 * p));
                matTrafo.emissive.setHex(0xff2a10);
                matTrafo.emissiveIntensity = (0.05 + 0.85 * p) * (0.6 + 0.4 * pulse);
                matRadiator.emissive.setHex(0xff2a10);
                matRadiator.emissiveIntensity = (0.04 + 0.7 * p) * (0.6 + 0.4 * pulse);
                alarmLight.intensity = 3.2 * (0.5 + 0.5 * Math.sin(time * 6)) * ss(INTRO, INTRO + 1.5, st.t);
                vignette.style.opacity = String(0.35 + 0.35 * Math.sin(time * 5));
                trafoGroup.position.x = Math.sin(time * 55) * 0.006 * (1 + 5 * p) * ss(0, 0.4, p);
                const s = 1 + 0.012 * p * Math.sin(time * 18);
                trafoGroup.scale.set(s, 1 + 0.015 * p * Math.sin(time * 22), s);

                st.smoke += dt * (st.t > INTRO ? 2 + 34 * Math.pow(p, 1.1) : 0);
                while (st.smoke >= 1) {
                  st.smoke -= 1;
                  emit(smokePool, rnd(-1.2, 1.2), rnd(2.6, 3.8), rnd(-0.8, 0.6), rnd(0.2, 1.0), rnd(1.4, 2.6) + p * 2, rnd(-0.3, 0.3), rnd(3, 4.5), rnd(0.3, 0.5), rnd(1.4, 2.4), 0.55);
                }
                st.spark += dt * (p > 0.1 ? 2 + 14 * p : 0);
                while (st.spark >= 1) {
                  st.spark -= 1;
                  const bx = [-0.8, 0, 0.8][Math.floor(Math.random() * 3)];
                  emit(sparkPool, bx, 3.9, 0.4, rnd(-3, 3), rnd(2, 6), rnd(-3, 3), rnd(0.5, 1.1), 1, 0, 1);
                }
                if (st.t >= INTRO) updateArcs(p);
                if (p > 0.6) st.shake = Math.max(st.shake, (p - 0.6) / 0.4 * 0.12);
                evac.forEach(e => { if (st.t > e.at) e.obj.visible = false; });
                if (st.mqNext <= time && failureSim.mqTexture) {
                  st.mqNext = time + 0.2;
                  failureSim.paintAlert(failureSim.mqTexture.image.getContext('2d'), 512, 320, time);
                  failureSim.mqTexture.needsUpdate = true;
                }
                ui(false);
                if (st.t >= FAIL_SECONDS) explode(time);
              } else if (st.phase === 'exploded') {
                st.te += dt;
                const te = st.te;
                blastLight.intensity = 38 * Math.exp(-te * 2.2);
                alarmLight.intensity = 0;
                vignette.style.opacity = '0';
                trafoGroup.scale.set(1, 1, 1);
                trafoGroup.position.x = 0;
                fireballs.forEach(f => {
                  const q = Math.max(0, te - f.delay);
                  f.mesh.visible = q > 0 && q < 3;
                  const r = f.r * (1 - Math.exp(-q * 3.4)) + 0.2;
                  f.mesh.scale.set(r, r * 0.85, r);
                  f.mesh.position.y = 2.2 + r * 0.35;
                  f.mesh.material.opacity = Math.max(0, 0.95 * (1 - ss(0.5, 2.6, q)));
                });
                ring.visible = te < 3.2;
                const rr = 1 + 32 * te;
                ring.scale.set(rr, rr, rr);
                ring.material.opacity = 0.7 * (1 - te / 3.2);
                dome.visible = te < 1.6;
                dome.scale.setScalar(1 + 26 * te);
                dome.material.opacity = 0.35 * (1 - te / 1.6);

                collapses.forEach(c => {
                  if (!c.started && rr >= c.dist) startCollapse(c);
                  if (c.started && !c.ruin.visible) {
                    c.tc += dt;
                    const g = plantParts[c.def.key];
                    const e = ss(0, 1.2, c.tc);
                    if (g) {
                      g.scale.y = Math.max(0.05, 1 - 0.95 * e * e);
                      g.position.x = Math.sin(time * 70) * 0.05 * (1 - e);
                    }
                    if (Math.random() < 0.6) emit(dustPool, c.wx + rnd(-2, 2), 0.5, c.wz + rnd(-2, 2), rnd(-1, 1), rnd(0.8, 2.5), rnd(-1, 1), rnd(2, 3.5), 1.2, 3, 0.55);
                    if (c.tc >= 1.2) {
                      if (g) g.visible = false;
                      c.ruin.visible = true;
                      c.ruin.scale.set(1, 1, 1);
                      c.ruinFires.forEach(f => {
                        f.group.visible = true;
                        f.amount = 1;
                      });
                    }
                  }
                });

                // apagão que se espalha a partir da subestação
                if (te >= 0.9) {
                  failureSim.mode = 'dark';
                  failureSim.waveR = (te - 0.9) * 9;
                }
                if (failureSim.waveR >= 95 && !st.breakerDone) {
                  st.breakerDone = true;
                  setBreakerClosed(false);
                  setAlarms(prev => [{ id: Date.now(), msg: 'FALHA: Trafo 01 destruído. Cidade sem energia.', time: new Date().toLocaleTimeString() }, ...prev]);
                }
                rerouteVans(time, true);

                // câmera sobe para uma vista aérea da cidade apagando
                if (te >= 1.2) {
                  if (!st.cam) st.cam = { t: 0, pos: controls.object.position.clone(), tgt: controls.target.clone() };
                  st.cam.t = Math.min(1, st.cam.t + dt / 3.8);
                  const e = ss(0, 1, st.cam.t);
                  controls.object.position.lerpVectors(st.cam.pos, AERIAL_POS, e);
                  controls.target.lerpVectors(st.cam.tgt, AERIAL_TARGET, e);
                }

                st.shake = Math.max(0, st.shake - dt * 0.4);
                st.smoke += dt * 22;
                while (st.smoke >= 1) {
                  st.smoke -= 1;
                  emit(smokePool, rnd(-1.8, 1.8), rnd(1.2, 2.4), rnd(-1.8, 1.8), rnd(0.4, 1.4), rnd(2.2, 4.2), rnd(-0.4, 0.4), rnd(5, 8), rnd(0.8, 1.2), rnd(2.6, 4), 0.7);
                }
                st.dust += dt * 7;
                while (st.dust >= 1) {
                  st.dust -= 1;
                  const c = collapses[Math.floor(Math.random() * collapses.length)];
                  if (c.ruin.visible) emit(smokePool, c.wx + rnd(-1.5, 1.5), 1, c.wz + rnd(-1.5, 1.5), rnd(0.2, 1.2), rnd(1.4, 2.8), rnd(-0.3, 0.3), rnd(4, 6.5), 0.7, 2.4, 0.5);
                }
                if (Math.random() < 0.15) emit(sparkPool, rnd(-1.5, 1.5), 1.2, rnd(-1.5, 1.5), rnd(-2, 2), rnd(3, 7), rnd(-2, 2), rnd(0.6, 1.2), 1, 0, 1);
                if (failureSim.mqTexture && st.mqNext <= time) {
                  st.mqNext = time + 0.2;
                  failureSim.paintAlert(failureSim.mqTexture.image.getContext('2d'), 512, 320, time);
                  failureSim.mqTexture.needsUpdate = true;
                }

                knocked.forEach(k => {
                  k.t = Math.min(1, k.t + dt / 0.7);
                  const e = 1 - Math.pow(1 - k.t, 2);
                  k.obj.position.set(k.start.x + k.dir.x * 3 * e, k.start.y + 0.15 * e, k.start.z + k.dir.z * 3 * e);
                  k.obj.rotation.x = -Math.PI / 2 * e;
                });
              } else {
                // restauração gradual
                st.tr += dt;
                const tr = st.tr;
                alarmLight.intensity = 0;
                blastLight.intensity = 0;
                ring.visible = false;
                dome.visible = false;
                rerouteVans(time, false);

                // câmera acompanha o que está sendo reconstruído
                const shot = RESTORE_SHOTS.find(sh => tr < sh.until);
                const camK = 1 - Math.exp(-dt * 2.4);
                controls.object.position.lerp(shot.pos, camK);
                controls.target.lerp(shot.tgt, camK);

                // 1. fogo e fumaça diminuem, destroços somem
                const calm = 1 - ss(0, 3, tr);
                fires.forEach(f => { f.amount = calm; if (calm <= 0.01) f.group.visible = false; });
                st.smoke += dt * 22 * calm;
                while (st.smoke >= 1) {
                  st.smoke -= 1;
                  emit(smokePool, rnd(-1.8, 1.8), rnd(1.2, 2.4), rnd(-1.8, 1.8), rnd(0.4, 1.4), rnd(2.2, 4.2), rnd(-0.4, 0.4), rnd(4, 6), rnd(0.8, 1.2), rnd(2.6, 4), 0.6);
                }
                const shrink = 1 - ss(0.4, 3.2, tr);
                debris.forEach(p => {
                  if (!p.mesh.visible) return;
                  p.mesh.scale.setScalar(Math.max(0.001, shrink));
                  if (shrink <= 0.01) {
                    p.mesh.visible = false;
                    p.rest = true;
                  }
                });

                // 2. prédios se reerguem
                collapses.forEach((c, i) => {
                  const tb = tr - 6.5 - i * 0.5;
                  if (tb <= 0) return;
                  const g = plantParts[c.def.key];
                  const e = ss(0, 3.6, tb);
                  if (g) {
                    g.visible = true;
                    g.position.x = 0;
                    g.scale.y = 0.04 + 0.96 * e;
                  }
                  c.ruin.scale.y = Math.max(0.001, 1 - ss(0, 1.8, tb));
                  if (c.ruin.scale.y <= 0.01) c.ruin.visible = false;
                  if (tb < 3.6 && Math.random() < 0.5) emit(dustPool, c.wx + rnd(-2, 2), 0.4, c.wz + rnd(-2, 2), rnd(-0.6, 0.6), rnd(0.5, 1.5), rnd(-0.6, 0.6), rnd(2, 3), 1.0, 2.2, 0.35);
                });

                // 3. transformador reconstruído
                const tt = tr - 3.0;
                if (tt > 0) {
                  wreck.scale.y = Math.max(0.001, 1 - ss(0, 2.2, tt));
                  if (wreck.scale.y <= 0.01) wreck.visible = false;
                  trafoGroup.visible = true;
                  trafoGroup.position.x = 0;
                  trafoGroup.scale.set(1, 0.03 + 0.97 * ss(0, 3.2, tt), 1);
                  matTrafo.emissive.setHex(0x000000);
                  matTrafo.emissiveIntensity = 0;
                  matRadiator.emissive.setHex(0x000000);
                  matRadiator.emissiveIntensity = 0;
                  if (tt < 3.2 && Math.random() < 0.5) emit(sparkPool, rnd(-1.5, 1.5), 0.6 + 3 * ss(0, 3.2, tt), rnd(-1, 1), rnd(-2, 2), rnd(1, 4), rnd(-2, 2), rnd(0.3, 0.7), 1, 0, 1);
                  if (tt > 3.2) {
                    setShown(attached, true);
                    if (installer.props) installer.props.visible = true;
                  }
                }

                // 4. a energia volta em uma onda a partir da subestação
                if (tr >= 11) {
                  failureSim.waveR = (tr - 11) * 11;
                  if (tr > 11.5) particleSystemsRef.current.forEach(p => { p.visible = true; });
                }

                // 5. telas e alarmes voltam ao normal
                if (tr > 7 && !st.screensBack) {
                  st.screensBack = true;
                  failureSim.active = false;
                  failureSim.exploded = false;
                  try {
                    const mq = failureSim.mqTexture;
                    if (mq && st.mqSnap) {
                      mq.image.getContext('2d').putImageData(st.mqSnap, 0, 0);
                      mq.needsUpdate = true;
                    }
                  } catch (e) {
                    // sem restauração da tela
                  }
                }
                vignette.style.opacity = '0';

                // 6. técnico e vigias se levantam e voltam ao trabalho; funcionários voltam
                knocked.forEach(k => {
                  const e = ss(14, 15.6, tr);
                  k.obj.position.set(k.start.x + k.dir.x * 3 * (1 - e), k.start.y + 0.15 * (1 - e), k.start.z + k.dir.z * 3 * (1 - e));
                  k.obj.rotation.x = -Math.PI / 2 * (1 - e);
                });
                if (tr > 15.8 && !st.knockReleased) {
                  st.knockReleased = true;
                  installer.disabled = false;
                  walkers.forEach(w => { w.knocked = false; });
                  knocked.length = 0;
                }
                evac.forEach(e => { if (tr > e.back) e.obj.visible = true; });

                if (tr >= RESTORE_SECONDS) {
                  st.phase = 'idle';
                  st.t = 0;
                  failureSim.mode = 'normal';
                  failureSim.waveR = 0;
                  failureSim.active = false;
                  failureSim.exploded = false;
                  failureSim.elapsed = 0;
                  trafoGroup.scale.set(1, 1, 1);
                  wreck.visible = false;
                  fires.forEach(f => { f.group.visible = false; });
                  collapses.forEach(c => {
                    c.started = false;
                    c.ruin.visible = false;
                    const g = plantParts[c.def.key];
                    if (g) {
                      g.visible = true;
                      g.scale.set(1, 1, 1);
                      g.position.set(0, 0, 0);
                    }
                  });
                  evac.forEach(e => { e.obj.visible = true; });
                  particleSystemsRef.current.forEach(p => { p.visible = true; });
                  ui(true);
                } else ui(false);
              }
              shake.set(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(st.shake);
            },
            late: (time) => {
              if (st.phase === 'idle' || !failureSim.active) return;
              const blink = Math.floor(time * 4) % 2 === 0;
              ['tm', 'bm', 'gmp', 'dm1', 'dm2'].forEach(key => {
                const node = moduleNodes[key];
                if (node && node.led) node.led.material.color.set(st.phase === 'countdown' ? (blink ? '#ff2a2a' : '#5a0000') : '#1a1a1a');
              });
              if (treetechLed.mesh) treetechLed.mesh.material.color.set(st.phase === 'countdown' ? (blink ? '#ff2a2a' : '#5a0000') : '#1a1a1a');
            }
          };
        })();

        sceneApiRef.current.startFailure = failureCtl.start;
        sceneApiRef.current.resetFailure = failureCtl.restore;
        sceneApiRef.current.abortFailure = failureCtl.abort;

        // LOOP DE ANIMAÇÃO 3D
        let animationFrameId;
        const clock = new THREE.Clock();

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const time = clock.getElapsedTime();

          controls.update();
          failureCtl.update(time);

          // Animação de partículas de energia fluindo pelos cabos
          particleSystemsRef.current.forEach(p => {
            const { curve, speed } = p.userData;
            p.userData.progress = (p.userData.progress + speed) % 1;
            const posArr = p.geometry.attributes.position.array;

            for (let i = 0; i < 5; i++) {
              const t = (p.userData.progress + i * 0.18) % 1;
              const pt = curve.getPoint(t);
              posArr[i * 3] = pt.x;
              posArr[i * 3 + 1] = pt.y;
              posArr[i * 3 + 2] = pt.z;
            }
            p.geometry.attributes.position.needsUpdate = true;
          });

          // Escritório da usina: pessoas sentadas digitando, uma pessoa andando e o telhado abrindo
          plantSeated.forEach(s => {
            const t = time + s.phase;
            const parts = s.worker.userData;
            parts.leftArm.rotation.x = -1.0 + Math.sin(t * 9) * 0.08;
            parts.rightArm.rotation.x = -1.0 + Math.sin(t * 9 + 1.3) * 0.08;
            parts.head.rotation.x = Math.sin(t * 0.7) * 0.08;
          });
          [plantOfficeWalker, treetechWalker].forEach(officeWalker => {
            if (!officeWalker.group) return;
            const travelled = time * 0.8;
            const s = samplePath(officeWalker.path, travelled);
            officeWalker.group.position.set(s.x, 0.1, s.z);
            officeWalker.group.rotation.y = s.heading;

            const swing = Math.sin(travelled * 4.5) * 0.7;
            const parts = officeWalker.group.userData;
            parts.leftLeg.rotation.x = swing;
            parts.rightLeg.rotation.x = -swing;
            parts.leftArm.rotation.x = -swing * 0.8;
            parts.rightArm.rotation.x = swing * 0.8;
          });
          roofToggles.forEach(toggle => {
            toggle.amount += ((toggle.open ? 1 : 0) - toggle.amount) * 0.12;
            if (toggle.walls) toggle.walls.scale.y = 1 - 0.7 * toggle.amount;
            if (toggle.roof) toggle.roof.visible = !toggle.open;
          });

          updateWorld(time);
          updateNetwork(time);
          failureCtl.late(time);
          updateDusk();
          applyDuskLamps();

          // Usina: ventoinhas girando e fumaça nas chaminés
          plantFans.forEach(fan => {
            fan.rotation.y += 0.25;
          });
          plantSteam.forEach(p => {
            p.position.y += p.userData.speed;
            p.position.x += Math.sin(time * 2 + p.position.y) * 0.005;
            p.scale.addScalar(p.userData.scaleSpeed);
            p.material.opacity -= 0.004;

            if (p.material.opacity <= 0 || p.position.y > p.userData.baseY + 3.0) {
              p.position.y = p.userData.baseY;
              p.position.x = p.userData.emitterX + (Math.random() - 0.5) * 0.2;
              p.position.z = p.userData.emitterZ + (Math.random() - 0.5) * 0.2;
              p.scale.set(1, 1, 1);
              p.material.opacity = 0.45;
            }
          });

          // Cidade: pulsos, cabos e janelas seguem o estado do disjuntor
          const breakerOn = breakerClosedRef.current;
          cityPulses.forEach(p => {
            const lit = breakerOn && failureSim.lit(p.position.x + cityWorld.position.x, p.position.z + cityWorld.position.z);
            p.visible = lit;
            if (lit) {
              p.userData.progress = (p.userData.progress + p.userData.speed) % 1;
              p.position.copy(p.userData.curve.getPoint(p.userData.progress));
            }
          });
          cityWires.forEach(w => {
            if (!w.center) {
              w.mesh.geometry.computeBoundingBox();
              w.center = w.mesh.geometry.boundingBox.getCenter(new THREE.Vector3());
            }
            const lit = breakerOn && failureSim.lit(w.center.x + cityWorld.position.x, w.center.z + cityWorld.position.z);
            w.mesh.material.color.setHex(lit ? w.baseColor : 0x64748b);
            w.mesh.material.emissive.setHex(lit ? w.baseColor : 0x000000);
          });
          cityWindows.forEach(win => {
            if (!win.userData.wp) win.userData.wp = win.getWorldPosition(new THREE.Vector3());
            const lit = breakerOn && failureSim.lit(win.userData.wp.x, win.userData.wp.z);
            win.material.color.setHex(lit ? 0xf3e6a8 : (win.userData.dayColor || 0x334155));
          });

          // Pessoas caminhando: posição pela distância percorrida, passos sincronizados com ela
          walkers.forEach(w => {
            if (w.knocked) return;
            const travelled = time * w.speed + w.offset;
            const s = samplePath(w.path, travelled);
            w.group.position.set(s.x, 0.35, s.z);
            w.group.rotation.y = s.heading;

            const swing = Math.sin(travelled * 4.5) * 0.7;
            const { leftLeg, rightLeg, leftArm, rightArm } = w.group.userData;
            leftLeg.rotation.x = swing;
            rightLeg.rotation.x = -swing;
            leftArm.rotation.x = -swing * 0.8;
            rightArm.rotation.x = swing * 0.8;
          });

          // Animação suave de pulso do transformador quando energizado
          if (breakerClosed && componentMeshesRef.current['transformer']) {
            const trafo = componentMeshesRef.current['transformer'];
            const vibe = Math.sin(time * 30) * 0.002 * (loadLevel / 100);
            trafo.position.y = vibe;
          }

          camera.position.add(failureCtl.shake);
          renderer.render(scene, camera);
          camera.position.sub(failureCtl.shake);
        };

        animate();

        // Cleanup
        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('click', handleClick);
          window.removeEventListener('pointerdown', handlePressStart);
          window.removeEventListener('click', handleOfficeClick);
          cancelAnimationFrame(animationFrameId);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      // Atualizar o modo de renderização (Normal e Fim de Tarde)
      useEffect(() => {
        if (!sceneRef.current) return;
        const scene = sceneRef.current;

        viewModeRef.current = viewMode;
        if (viewMode !== 'dusk') scene.background = new THREE.Color('#dbeafe');
        sceneApiRef.current.setDusk(viewMode === 'dusk');
      }, [viewMode]);

      // Alternar Ângulos de Câmera
      const setCameraPreset = (preset) => {
        if (!controlsRef.current) return;
        const controls = controlsRef.current;

        switch (preset) {
          case 'overview':
            controls.object.position.set(109, 75, 84);
            controls.target.set(29, 0, 4);
            break;
          case 'plant':
            controls.object.position.set(40, 22, 28);
            controls.target.set(16.4, 3, 0);
            break;
          case 'interior':
            plantRoofApiRef.current.setOpen(true);
            controls.object.position.set(25, 12, -12.8);
            controls.target.set(19, 0.8, -1.8);
            break;
          case 'network':
            controls.object.position.set(60, 24, 26);
            controls.target.set(38, 0.5, 3);
            break;
          case 'factory':
            sceneApiRef.current.setRoofs({ factory: true });
            controls.object.position.set(68, 16, 47);
            controls.target.set(54, 1, 33);
            break;
          case 'dashboard':
            treetechRoofApiRef.current.setOpen(true);
            controls.object.position.set(46, 7, 17);
            controls.target.set(46, 2.1, 5.7);
            break;
          case 'treetech':
            treetechRoofApiRef.current.setOpen(true);
            controls.object.position.set(66, 14, 23);
            controls.target.set(54, 1, 8);
            break;
          case 'city':
            controls.object.position.set(80, 32, 14);
            controls.target.set(54, 2, -18.5);
            break;
          case 'iso':
            controls.object.position.set(22, 18, 22);
            controls.target.set(0, 2.5, 0);
            break;
          case 'top':
            controls.object.position.set(0, 30, 0.1);
            controls.target.set(0, 0, 0);
            break;
          case 'trafo':
            controls.object.position.set(5, 4, 6);
            controls.target.set(0, 2, 0);
            setSelectedComponent('transformer');
            break;
          case 'gantry':
            controls.object.position.set(0, 8, -12);
            controls.target.set(0, 5, -4.5);
            setSelectedComponent('gantry');
            break;
          default:
            break;
        }
      };

      // Tour guiado: move a câmera, escolhe o modo de comunicação, abre os telhados e mostra os rótulos do passo
      const goToTourStep = (index) => {
        const step = TOUR_STEPS[index];
        if (!step || !controlsRef.current) return;
        const controls = controlsRef.current;
        controls.object.position.set(...step.camera.position);
        controls.target.set(...step.camera.target);
        sceneApiRef.current.setMode(step.mode);
        sceneApiRef.current.setRoofs(step.roofs);
        sceneApiRef.current.setLabels(step.labels);
        setTourStep(index);
      };

      const endTour = () => {
        setTourStep(null);
        sceneApiRef.current.setMode('sync');
        sceneApiRef.current.setLabels(null);
      };

      // Alternar Estado do Disjuntor Principal
      const toggleBreaker = () => {
        const newState = !breakerClosed;
        setBreakerClosed(newState);

        if (!newState) {
          setAlarms(prev => [
            { id: Date.now(), msg: "ALERTA: Disjuntor Principal Abertura de Emergência!", time: new Date().toLocaleTimeString() },
            ...prev
          ]);
        } else {
          setAlarms(prev => [
            { id: Date.now(), msg: "SISTEMA: Disjuntor Reagrupado e Energizado.", time: new Date().toLocaleTimeString() },
            ...prev
          ]);
        }
      };

      return (
        <div className="relative w-full h-screen pointer-events-none select-none text-slate-100 flex flex-col justify-between p-4">

          {/* CONTROLES RÁPIDOS */}
          <header className="pointer-events-none flex justify-end">
            {/* BARRA DE CONTROLES RÁPIDOS */}
            <div className="pointer-events-auto flex items-center gap-2 bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-xl p-2 shadow-2xl">
              {failure.phase === 'idle' && (
                <button
                  onClick={() => { prevViewMode.current = viewMode === 'dusk' ? null : viewMode; setViewMode('dusk'); setCameraPreset('dashboard'); sceneApiRef.current.startFailure(); }}
                  className="px-3 py-2 rounded-lg font-bold text-xs bg-red-700 hover:bg-red-600 text-white shadow-lg shadow-red-900/50 border border-red-400/60"
                >
                  ⚠ FALHA
                </button>
              )}
              {failure.phase === 'countdown' && (
                <button
                  onClick={() => sceneApiRef.current.abortFailure()}
                  className="px-3 py-2 rounded-lg font-bold text-xs bg-amber-500 hover:bg-amber-400 text-slate-900 border border-amber-200 shadow-lg shadow-amber-900/40"
                >
                  ■ DESATIVAR FALHA · {failure.remaining}s
                </button>
              )}
              {failure.phase === 'aborting' && (
                <button disabled className="px-3 py-2 rounded-lg font-bold text-xs bg-amber-900 text-amber-200 border border-amber-500 animate-pulse">
                  ■ DESATIVANDO…
                </button>
              )}
              {failure.phase === 'exploded' && (
                <button
                  onClick={() => sceneApiRef.current.resetFailure()}
                  className="px-3 py-2 rounded-lg font-bold text-xs bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-300/60"
                >
                  ↺ RESTAURAR SISTEMA
                </button>
              )}
              {failure.phase === 'restoring' && (
                <button disabled className="px-3 py-2 rounded-lg font-bold text-xs bg-emerald-900 text-emerald-200 border border-emerald-500 animate-pulse">
                  ↺ RESTAURANDO… {failure.remaining}%
                </button>
              )}
              <button
                onClick={toggleBreaker}
                className={`px-3 py-2 rounded-lg font-bold text-xs transition-all shadow-lg flex items-center gap-2 ${
                  breakerClosed
                    ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-rose-900/40'
                    : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/40'
                }`}
              >
                <Icons.Zap />
                {breakerClosed ? 'DESENERGIZAR DISJUNTOR' : 'ENERGIZAR SUBESTAÇÃO'}
              </button>
            </div>
          </header>

          {/* PAINEL DA FALHA: contagem regressiva e alertas girando */}
          {failure.phase === 'countdown' && (
            <div className="pointer-events-none fixed left-1/2 -translate-x-1/2 top-20 w-[30rem] max-w-[92vw] z-30">
              <div className="bg-red-700/95 border-2 border-red-300 rounded-xl px-4 py-3 shadow-2xl shadow-red-900/60 animate-pulse text-center">
                <div className="text-[11px] font-bold tracking-widest text-red-100">FALHA CRÍTICA · TRAFO 01</div>
                <div className="text-4xl font-black font-mono text-white leading-tight">
                  {String(Math.floor(failure.remaining / 60)).padStart(1, '0')}:{String(failure.remaining % 60).padStart(2, '0')}
                </div>
                <div className="text-[11px] text-red-100">tempo até a explosão</div>
              </div>
              <div className="mt-2 flex flex-col gap-1">
                {failure.alerts.map((alert, i) => (
                  <div key={alert} className={`bg-slate-950/90 border border-red-500/70 text-red-200 text-xs rounded-lg px-3 py-1.5 ${i === 0 ? 'font-bold opacity-100' : 'opacity-60'}`}>
                    ⚠ {alert}
                  </div>
                ))}
              </div>
            </div>
          )}
          {failure.phase === 'exploded' && (
            <div className="pointer-events-none fixed left-1/2 -translate-x-1/2 top-20 z-30 bg-slate-950/90 border-2 border-red-500 rounded-xl px-5 py-3 text-center shadow-2xl">
              <div className="text-sm font-black text-red-400 tracking-wider">TRANSFORMADOR DESTRUÍDO</div>
              <div className="text-xs text-slate-300">A usina foi atingida e a cidade está sem energia.</div>
            </div>
          )}

          {/* PAINEL CENTRAL DE VISUALIZAÇÃO E TELEMETRIA */}
          <div className="flex justify-between items-start gap-4 my-auto">

            {/* PAINEL ESQUERDO: SELEÇÃO DE VISTAS E MODOS */}
            <div className="pointer-events-auto bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-xl p-3 flex flex-col gap-3 w-48 shadow-xl">
              <button onClick={() => goToTourStep(0)} className="px-2 py-2 bg-emerald-600 hover:bg-emerald-500 rounded text-xs font-bold text-white">
                Tour: como funciona
              </button>
              <div className="text-xs font-bold text-slate-400 tracking-wider uppercase border-b border-slate-800 pb-1.5 flex items-center gap-1.5">
                <Icons.Camera /> Câmera Presets
              </div>
              <div className="grid grid-cols-2 gap-1.5">
                <button onClick={() => setCameraPreset('overview')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Visão Geral</button>
                <button onClick={() => setCameraPreset('city')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Cidade</button>
                <button onClick={() => setCameraPreset('plant')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Usina</button>
                <button onClick={() => setCameraPreset('interior')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Interior</button>
                <button onClick={() => setCameraPreset('treetech')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Treetech</button>
                <button onClick={() => setCameraPreset('network')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Rede</button>
                <button onClick={() => setCameraPreset('dashboard')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Painel</button>
                <button onClick={() => setCameraPreset('factory')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Fábrica</button>
                <button onClick={() => setCameraPreset('iso')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Isométrica</button>
                <button onClick={() => setCameraPreset('top')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Planta Baixa</button>
                <button onClick={() => setCameraPreset('trafo')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Trafo 01</button>
                <button onClick={() => setCameraPreset('gantry')} className="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs text-slate-200 border border-slate-700">Pórtico AT</button>
              </div>

              <div className="text-xs font-bold text-slate-400 tracking-wider uppercase border-b border-slate-800 pb-1.5 mt-2 flex items-center gap-1.5">
                <Icons.Eye /> Modos de Render
              </div>
              <div className="flex flex-col gap-1.5">
                <button onClick={() => setViewMode('normal')} className={`px-2.5 py-1.5 rounded text-xs text-left border ${viewMode === 'normal' ? 'bg-sky-600/30 border-sky-500 text-sky-200' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>Standard 3D</button>
                <button onClick={() => setViewMode('dusk')} className={`px-2.5 py-1.5 rounded text-xs text-left border ${viewMode === 'dusk' ? 'bg-sky-600/30 border-sky-500 text-sky-200' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>Fim de Tarde</button>
              </div>
            </div>

            {/* CARD DE DETALHES DO COMPONENTE SELECIONADO (DIREITA) */}
            {selectedComponent && componentData[selectedComponent] && (
              <div className="pointer-events-auto bg-slate-900/90 backdrop-blur-md border border-slate-700 rounded-xl p-4 w-80 shadow-2xl animate-fade-in">
                <div className="flex justify-between items-start border-b border-slate-800 pb-2 mb-3">
                  <h3 className="font-bold text-sm text-amber-400">{componentData[selectedComponent].title}</h3>
                  <button onClick={() => setSelectedComponent(null)} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-300 mb-3 leading-relaxed">{componentData[selectedComponent].desc}</p>

                <div className="space-y-2 text-xs bg-slate-950/60 p-3 rounded-lg border border-slate-800">
                  {componentData[selectedComponent].voltage && (
                    <div className="flex justify-between"><span className="text-slate-400">Tensão Operacional:</span><span className="font-mono text-sky-300">{componentData[selectedComponent].voltage}</span></div>
                  )}
                  {componentData[selectedComponent].power && (
                    <div className="flex justify-between"><span className="text-slate-400">Potência Nominal:</span><span className="font-mono text-emerald-300">{componentData[selectedComponent].power}</span></div>
                  )}
                  {componentData[selectedComponent].temp && (
                    <div className="flex justify-between"><span className="text-slate-400">Temperatura Estimada:</span><span className="font-mono text-amber-300">{componentData[selectedComponent].temp}</span></div>
                  )}
                  <div className="flex justify-between"><span className="text-slate-400">Status Operacional:</span><span className="font-mono text-indigo-300">{componentData[selectedComponent].status}</span></div>
                </div>
              </div>
            )}
          </div>


          {/* PAINEL DO TOUR GUIADO */}
          {tourStep !== null && (
            <div className="pointer-events-auto fixed left-1/2 -translate-x-1/2 bottom-24 w-[34rem] max-w-[92vw] bg-slate-900/95 backdrop-blur-md border border-emerald-500/50 rounded-xl p-4 shadow-2xl">
              <div className="flex items-center justify-between mb-1">
                <span className="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">
                  Tour: como funciona · passo {tourStep + 1} de {TOUR_STEPS.length}
                </span>
                <button onClick={endTour} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
              </div>
              <h3 className="font-bold text-base text-white mb-1">{TOUR_STEPS[tourStep].title}</h3>
              <p className="text-xs text-slate-300 leading-relaxed mb-3">{TOUR_STEPS[tourStep].text}</p>
              <div className="flex items-center justify-between">
                <div className="flex gap-1.5">
                  {TOUR_STEPS.map((_, i) => (
                    <span key={i} className={`w-2 h-2 rounded-full ${i === tourStep ? 'bg-emerald-400' : 'bg-slate-600'}`} />
                  ))}
                </div>
                <div className="flex gap-2">
                  <button
                    disabled={tourStep === 0}
                    onClick={() => goToTourStep(tourStep - 1)}
                    className="px-3 py-1.5 rounded bg-slate-800 border border-slate-700 text-xs text-slate-200 disabled:opacity-40"
                  >
                    Anterior
                  </button>
                  {tourStep < TOUR_STEPS.length - 1 ? (
                    <button
                      onClick={() => goToTourStep(tourStep + 1)}
                      className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white"
                    >
                      Próximo
                    </button>
                  ) : (
                    <button onClick={endTour} className="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white">
                      Concluir
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Renderização do App React
    ReactDOM.createRoot(document.getElementById('root')).render(<SubstationApp />);
  </script>
</body>
</html>
